# Cloud Build pipeline for the intake-form-dispatcher Cloud Function.
#
# Steps:
#   1. Run unit tests
#   2. Build & push Docker image
#   3. Deploy to Cloud Run (HTTP trigger, internal only)
#
# Substitution variables (set in Cloud Build trigger):
#   _SERVICE_NAME           — Cloud Run service / image name (e.g. intake-form-dispatcher)
#   _REPO                   — Artifact Registry repo URL
#   _REGION                 — GCP region (e.g. us-central1)
#   _ENV                    — dev | test | prod
#   _FROM_EMAIL             — sender address (e.g. noreply@simpletort.com)
#   _ADMIN_EMAIL            — admin alert address
#   _FIRESTORE_DATABASE_ID  — Firestore database ID (default: (default))
#   _TOKEN_EXPIRY_DAYS      — intake token validity in days (default: 30)
#   _SERVICE_ACCOUNT_EMAIL  — Cloud Run runtime service account
#                             (e.g. intake-form-dispatcher-sa@PROJECT_ID.iam.gserviceaccount.com)
#
# Google Form field mapping (formBaseUrl + fieldMappings) is stored in Firestore
# at config/intake_form and is editable at runtime via Firebase Console — no
# redeploy needed when form entry IDs change.

steps:
  # ── Tests ──────────────────────────────────────────────────────────────
  - name: "python:3.11-slim"
    dir: "cloud-functions/intake-form-dispatcher"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt pytest pytest-mock
        pytest tests/ -v --tb=short

  # ── Build image ────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    dir: "cloud-functions/intake-form-dispatcher"
    args:
      - build
      - "-t"
      - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "-t"
      - "$_REPO/$_SERVICE_NAME:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:latest"]

  # ── Deploy to Cloud Run ────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=$_SERVICE_ACCOUNT_EMAIL"
      - "--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,ENV=$_ENV,FROM_EMAIL=$_FROM_EMAIL,ADMIN_EMAIL=$_ADMIN_EMAIL,FIRESTORE_DATABASE_ID=$_FIRESTORE_DATABASE_ID,TOKEN_EXPIRY_DAYS=$_TOKEN_EXPIRY_DAYS"
      - "--set-secrets=SENDGRID_API_KEY=SENDGRID_API_KEY:latest"
      - "--memory=256Mi"
      - "--cpu=1"
      - "--timeout=60s"
      - "--max-instances=10"
      - "--min-instances=0"

substitutions:
  _SERVICE_ACCOUNT_EMAIL: ""   # set in trigger — e.g. intake-form-dispatcher-sa@PROJECT_ID.iam.gserviceaccount.com

images:
  - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
  - "$_REPO/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
