# Cloud Build pipeline for the intake-drive-sync Cloud Function.
#
# Steps:
#   1. Run unit tests
#   2. Build & push Docker image
#   3. Deploy to Cloud Run (HTTP trigger, called by Apps Script)
#
# Substitution variables (set in Cloud Build trigger):
#   _SERVICE_NAME           — Cloud Run service / image name (e.g. intake-drive-sync)
#   _REPO                   — Artifact Registry repo URL
#   _REGION                 — GCP region (e.g. us-central1)
#   _ENV                    — dev | test | prod
#   _BUCKET                 — GCS bucket name (e.g. zadroga-case-files-PROJECT_ID)
#   _SERVICE_ACCOUNT_EMAIL  — Cloud Run runtime service account
#                             (e.g. intake-drive-sync-sa@PROJECT_ID.iam.gserviceaccount.com)

steps:
  # ── Tests ──────────────────────────────────────────────────────────────
  - name: "python:3.11-slim"
    dir: "cloud-functions/intake-drive-sync"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt pytest pytest-mock
        pytest tests/ -v --tb=short

  # ── Build image ────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    dir: "cloud-functions/intake-drive-sync"
    args:
      - build
      - "-t"
      - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "-t"
      - "$_REPO/$_SERVICE_NAME:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:latest"]

  # ── Deploy to Cloud Run ────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=$_SERVICE_ACCOUNT_EMAIL"
      - "--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET_NAME=$_BUCKET,ENV=$_ENV"
      - "--set-secrets=DRIVE_SYNC_SECRET=INTAKE_DRIVE_SYNC_SECRET:latest"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--timeout=300s"
      - "--max-instances=5"
      - "--min-instances=0"

substitutions:
  _SERVICE_ACCOUNT_EMAIL: ""   # set in trigger — e.g. intake-drive-sync-sa@PROJECT_ID.iam.gserviceaccount.com

images:
  - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
  - "$_REPO/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
