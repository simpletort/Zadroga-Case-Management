name: Deploy auth-rbac

on:
  push:
    branches: [main, dev]
    paths:
      - 'services/auth-rbac/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: simpletort-zadroga-dev
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── GCP Auth ────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set project
        run: gcloud config set project ${{ env.PROJECT_ID }}

      # ── Node + Python ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Firebase CLI ─────────────────────────────────────────────────────
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ── Python Functions Env ─────────────────────────────────────────────
      - name: Validate Python requirements
        working-directory: services/auth-rbac/backend/functions
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip -q
          venv/bin/pip install -r requirements.txt -q
          echo 'Python requirements validated'

      # ── Deploy in correct order ──────────────────────────────────────────
      - name: Deploy Firestore rules and indexes
        working-directory: services/auth-rbac/backend
        run: |
          firebase deploy --only firestore \
            --non-interactive \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Cloud Functions
        working-directory: services/auth-rbac/backend
        run: |
          firebase deploy --only functions \
            --non-interactive \
            --project ${{ env.PROJECT_ID }}

       # ── Allow unauthenticated access on public endpoints ─────────────────
      # IMPORTANT: 2nd gen functions run on Cloud Run. Must set IAM on the
      # Cloud Run service directly, NOT via gcloud functions add-invoker-policy-binding.
      - name: Allow unauthenticated access to public functions
        run: |
          for FUNCTION in register-fn password-reset-fn create-session-fn; do
            gcloud run services add-iam-policy-binding $FUNCTION \
              --region=${{ env.REGION }} \
              --member="allUsers" \
              --role="roles/run.invoker" \
              --project=${{ env.PROJECT_ID }}
          done

      # ── Wait for IAM propagation ─────────────────────────────────────────
      - name: Wait for IAM policy propagation
        run: sleep 120
      # ── Smoke test ───────────────────────────────────────────────────────
      # Fix 2: Rewrote exit check to avoid hidden character bug,
      # and added 401 as a detectable case with a clear error message.
      - name: Smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"","password":"","display_name":""}' \
            https://us-central1-simpletort-zadroga-dev.cloudfunctions.net/register_fn)
          echo "register_fn returned HTTP $STATUS"
          [ "$STATUS" != "401" ] || { echo "Still 401 after 90s"; exit 1; }