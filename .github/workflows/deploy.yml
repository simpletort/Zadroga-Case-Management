name: Deploy auth-rbac

on:
  push:
    branches: [main, dev]
    paths:
      - 'services/auth-rbac/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: simpletort-zadroga-dev
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── GCP Auth ────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set project
        run: gcloud config set project ${{ env.PROJECT_ID }}

      # ── Node + Python ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # # ── Frontend Build ───────────────────────────────────────────────────
      # - name: Install frontend dependencies
      #   working-directory: services/auth-rbac/frontend
      #   run: npm ci

      # - name: Build frontend
      #   working-directory: services/auth-rbac/frontend
      #   env:
      #     VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
      #     VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      #     VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      #     VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      #     VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      #     VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
      #     VITE_API_BASE_URL:                 ${{ secrets.VITE_API_BASE_URL }}
      #     VITE_USE_EMULATORS: 'false'
      #   run: npm run build

      # # ── CRITICAL: Copy frontend dist into backend for firebase deploy ────
      # - name: Stage frontend dist for Firebase Hosting
      #   run: |
      #     mkdir -p services/auth-rbac/backend/frontend
      #     cp -r services/auth-rbac/frontend/dist services/auth-rbac/backend/frontend/dist

      # - name: Verify frontend dist exists
      #   run: |
      #     ls -la services/auth-rbac/backend/frontend/dist/
      #     test -f services/auth-rbac/backend/frontend/dist/index.html || exit 1

      # ── Firebase CLI ─────────────────────────────────────────────────────
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ── Python Functions Env ─────────────────────────────────────────────
      # Note: Firebase CLI manages its own venv for Python functions.
      # This venv is for local validation only (not used by firebase deploy).
      - name: Validate Python requirements
        working-directory: services/auth-rbac/backend/functions
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip -q
          venv/bin/pip install -r requirements.txt -q
          echo 'Python requirements validated'

      # ── Deploy in correct order ──────────────────────────────────────────
      # Step 1: Firestore rules and indexes first (indexes take 5-30 min to build)
      - name: Deploy Firestore rules and indexes
        working-directory: services/auth-rbac/backend
        run: |
          firebase deploy --only firestore \
            --non-interactive \
            --project ${{ env.PROJECT_ID }}

      # Step 2: Cloud Functions
      - name: Deploy Cloud Functions
        working-directory: services/auth-rbac/backend
        run: |
          firebase deploy --only functions \
            --non-interactive \
            --project ${{ env.PROJECT_ID }}

      # # Step 3: Hosting (after functions so rewrites work immediately)
      # - name: Deploy Firebase Hosting
      #   working-directory: services/auth-rbac/backend
      #   run: |
      #     firebase deploy --only hosting \
      #       --non-interactive \
      #       --project ${{ env.PROJECT_ID }}

      # ── Smoke test ───────────────────────────────────────────────────────
      - name: Smoke test — register endpoint reachable
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"","password":"","display_name":""}' \
            https://${{ env.REGION }}-${{ env.PROJECT_ID }}.cloudfunctions.net/register_fn)
          echo "register_fn returned HTTP $STATUS"
          # 400 = validation error (correct — function is live)
          [ "$STATUS" = '400' ] || [ "$STATUS" = '200' ] || exit 1 