openapi: 3.0.3
info:
  title: ZAD Lead Intake API
  description: |
    Lead Intake & Automated Screening microservice for 9/11 VCF case management.
    
    ## Authentication
    All endpoints require a Bearer JWT token issued via OAuth2 client credentials flow.
    The `partner_id` claim within the JWT identifies the marketing partner.
    
    ## Rate Limiting
    100 requests per minute per `partner_id`. Exceeding this returns HTTP 429.
    
    ## Versioning Strategy
    URL-based versioning (`/api/v1/`). Breaking changes increment the major version.
    Non-breaking additions are made in-place with changelog updates.
    
    ## PHI Policy
    No personally identifiable health information is written to logs.
    All log entries use masked identifiers only.
  version: 1.0.0
  contact:
    name: ZAD Engineering
    email: engineering@zad.example.com

servers:
  - url: https://api.zad.example.com/api/v1
    description: Production
  - url: https://api-dev.zad.example.com/api/v1
    description: Development

security:
  - BearerAuth: []

paths:
  /leads:
    post:
      operationId: createLead
      summary: Ingest a new lead from a marketing partner
      description: |
        Validates lead data, detects duplicates, creates a Firestore case document
        with ID format ZAD-YYYY-MM-XXXX, publishes a Pub/Sub event, and triggers
        automated welcome communications and VCF eligibility screening.
      tags:
        - Leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadRequest'
            examples:
              valid_lead:
                summary: Valid lead submission
                value:
                  firstName: "John"
                  lastName: "Doe"
                  email: "john.doe@example.com"
                  phone: "+12125551234"
                  address:
                    street: "123 Main St"
                    city: "New York"
                    state: "NY"
                    zip: "10001"
                  exposureLocation: "World Trade Center"
                  exposureDates:
                    start: "2001-09-11"
                    end: "2001-12-31"
                  wtcHealthProgramStatus: "enrolled"
                  priorAttorney: false
                  marketingSource: "google_ads"
                  referralCode: "PARTNER-ABC-001"
      responses:
        '201':
          description: Lead created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadCreatedResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_field:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Request validation failed"
                    details:
                      - field: "email"
                        code: "INVALID_FORMAT"
                        message: "Must be a valid email address"
                    requestId: "req_abc123"
                    timestamp: "2025-03-15T10:00:00Z"
        '409':
          description: Duplicate lead detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  value:
                    error: "DUPLICATE_LEAD"
                    message: "A lead with this email and phone already exists"
                    details:
                      - field: "email+phone"
                        code: "DUPLICATE"
                        message: "Case ZAD-2025-03-0042 already exists for this contact"
                    requestId: "req_xyz789"
                    timestamp: "2025-03-15T10:00:00Z"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /leads/{leadId}:
    get:
      operationId: getLead
      summary: Retrieve lead/case by ID
      tags:
        - Leads
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            pattern: '^ZAD-\d{4}-\d{2}-\d{4}$'
            example: "ZAD-2025-03-0001"
      responses:
        '200':
          description: Lead found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDocument'
        '404':
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /leads/bulk-import:
    post:
      operationId: createBulkImportJob
      summary: Bulk import leads from an Excel file with user-selected column mapping
      description: |
        Registers the uploaded .xlsx file with the storage-gateway service for
        virus scanning and creates an async import job — the file is not
        parsed inline. Poll `GET /leads/bulk-import/{jobId}` for progress;
        rows are only parsed and processed once the virus scan clears. If the
        file is infected or the scan fails, the whole job fails and no leads
        are created. Each row is otherwise processed best-effort, matching
        `POST /leads/bulk-assign`'s semantics — one invalid or duplicate row
        never blocks the rest of the file.
      tags:
        - Bulk Import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - mapping
              properties:
                file:
                  type: string
                  format: binary
                  description: The .xlsx spreadsheet to import.
                mapping:
                  type: string
                  description: JSON-encoded BulkImportRequest (see schema) describing the confirmed column mapping.
      responses:
        '202':
          description: Import job accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadImportJobResponse'
        '400':
          description: Invalid mapping, non-.xlsx file, or unmatched columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /leads/bulk-import/{jobId}:
    get:
      operationId: getBulkImportJobStatus
      summary: Poll a bulk import job's status and summary counts
      tags:
        - Bulk Import
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadImportJobResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /leads/bulk-import/{jobId}/results:
    get:
      operationId: listBulkImportJobResults
      summary: List per-row results for a bulk import job
      tags:
        - Bulk Import
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: pageToken
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          description: Filter to a single outcome
          schema:
            type: string
            enum:
              - created
              - skipped_duplicate
              - failed
      responses:
        '200':
          description: Page of row results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadImportJobResultsPage'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued via OAuth2 client credentials. Contains `partner_id` claim.

  schemas:
    LeadRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - exposureLocation
        - exposureDates
        - wtcHealthProgramStatus
        - priorAttorney
        - marketingSource
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Claimant's legal first name
          example: "John"
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Claimant's legal last name
          example: "Doe"
        email:
          type: string
          format: email
          maxLength: 254
          description: Primary contact email. Used for duplicate detection.
          example: "john.doe@example.com"
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          description: |
            Phone number in E.164 format or local US format.
            Normalized to E.164 on ingestion. Used for duplicate detection.
          example: "+12125551234"
        ssn:
          type: string
          nullable: true
          pattern: '^[0-9-]{9,11}$'
          description: >
            Optional SSN. Accepts digits with or without dashes; normalized to
            digits-only before encryption at rest. Never logged.
          example: "123-45-6789"
        address:
          $ref: '#/components/schemas/Address'
        exposureLocation:
          type: string
          minLength: 1
          maxLength: 500
          description: Location where claimant was exposed (e.g. "World Trade Center", "Pentagon", "Shanksville")
          example: "World Trade Center"
        exposureDates:
          $ref: '#/components/schemas/ExposureDates'
        wtcHealthProgramStatus:
          type: string
          enum:
            - enrolled
            - applied
            - not_applied
            - unknown
          description: Current WTC Health Program enrollment status
          example: "enrolled"
        priorAttorney:
          type: boolean
          description: Whether the claimant has or had prior legal representation for this claim
          example: false
        marketingSource:
          type: string
          maxLength: 100
          description: Marketing channel that generated this lead
          example: "google_ads"
        referralCode:
          type: string
          maxLength: 100
          description: Partner-specific referral code for attribution tracking
          example: "PARTNER-ABC-001"

    Address:
      type: object
      properties:
        street:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        zip:
          type: string
          pattern: '^\d{5}(-\d{4})?$'

    ExposureDates:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date
          description: |
            Start date of exposure. Must fall within or overlap the VCF eligibility
            window: 2001-09-11 through 2011-05-30.
          example: "2001-09-11"
        end:
          type: string
          format: date
          description: |
            End date of exposure. Must be >= start date and overlap VCF window.
          example: "2001-12-31"

    LeadCreatedResponse:
      type: object
      required:
        - leadId
        - status
        - requestId
        - timestamp
      properties:
        leadId:
          type: string
          pattern: '^ZAD-\d{4}-\d{2}-\d{4}$'
          description: Generated case ID
          example: "ZAD-2025-03-0001"
        status:
          type: string
          enum:
            - New Lead
          description: Initial case status
        vcfScreeningStatus:
          type: string
          enum:
            - pending
            - eligible
            - ineligible
            - needs_review
          description: VCF eligibility screening result (async, may be 'pending')
        requestId:
          type: string
          description: Unique request trace ID for support
        timestamp:
          type: string
          format: date-time

    CaseDocument:
      type: object
      properties:
        caseId:
          type: string
          example: "ZAD-2025-03-0001"
        status:
          type: string
          enum:
            - New Lead
            - Screened
            - Qualified
            - Disqualified
            - Needs Review
            - Active
            - Closed
            - attorney_review
            - manual_review_required
            - settlement_pending_approval
            - Pending Client Information
            - VCF - Submitted
            - Awarded
        vcfEligibility:
          type: string
          enum:
            - pending
            - eligible
            - ineligible
            - needs_review
        ssn:
          type: string
          nullable: true
          description: >
            Optional SSN. Encrypted at rest via Cloud KMS CMEK.
            Returned as digits-only (9 chars) to authorized staff.
            Never logged.
          example: "123456789"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        marketingSource:
          type: string
        partnerId:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - requestId
        - timestamp
      properties:
        error:
          type: string
          enum:
            - VALIDATION_ERROR
            - DUPLICATE_LEAD
            - RATE_LIMIT_EXCEEDED
            - UNAUTHORIZED
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable error summary
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: Field name that caused the error
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable field-level error

    ColumnMapping:
      type: object
      required:
        - excelColumn
        - leadField
      properties:
        excelColumn:
          type: string
          description: Raw header text from the sheet, e.g. "First Name"
          example: "First Name"
        leadField:
          type: string
          description: Dotted path into LeadRequest, e.g. "exposureDates.start"
          example: "firstName"

    BulkImportRequest:
      type: object
      required:
        - columnMappings
        - marketingSource
      properties:
        columnMappings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ColumnMapping'
          description: >
            Must include a mapping for every LeadRequest field required by
            POST /leads (firstName, lastName, email, phone, exposureLocation,
            exposureDates.start, exposureDates.end, wtcHealthProgramStatus,
            priorAttorney) — marketingSource is supplied below, not mapped.
        headerRowIndex:
          type: integer
          default: 0
          minimum: 0
          description: 0-based row index of the header row
        sheetName:
          type: string
          nullable: true
          description: Sheet to read; defaults to the first sheet
        marketingSource:
          type: string
          maxLength: 100
          description: Applied to every imported row
        defaultReferralCode:
          type: string
          maxLength: 100
          nullable: true
          description: Used for rows that don't map a referralCode column

    LeadImportJobSummary:
      type: object
      properties:
        totalRows:
          type: integer
        processed:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer

    LeadImportJobResponse:
      type: object
      required:
        - jobId
        - status
        - summary
        - createdAt
        - updatedAt
        - fileName
        - partnerId
        - requestId
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
            - queued
            - scanning
            - processing
            - succeeded
            - failed
            - cancelled
        scanStatus:
          type: string
          nullable: true
          description: Mirrors storage-gateway's virus-scan status while the job is in the scanning stage
        summary:
          $ref: '#/components/schemas/LeadImportJobSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        fileName:
          type: string
        partnerId:
          type: string
        requestId:
          type: string
        errorMessage:
          type: string
          nullable: true
          description: Set only on a job-level failure (virus scan rejection, unparseable file, etc.)

    RowImportResult:
      type: object
      required:
        - rowNumber
        - outcome
      properties:
        rowNumber:
          type: integer
        outcome:
          type: string
          enum:
            - created
            - skipped_duplicate
            - failed
        caseId:
          type: string
          nullable: true
        error:
          nullable: true
          $ref: '#/components/schemas/ErrorDetail'
        vcfScreeningStatus:
          type: string
          nullable: true
          enum:
            - pending
            - eligible
            - ineligible
            - needs_review

    LeadImportJobResultsPage:
      type: object
      required:
        - jobId
        - results
      properties:
        jobId:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/RowImportResult'
        nextPageToken:
          type: string
          nullable: true
