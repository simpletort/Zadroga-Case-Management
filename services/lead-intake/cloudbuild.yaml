# ============================================================
# cloudbuild.yaml — Lead Intake CI/CD Pipeline
# Place this file at the ROOT of the lead-intake/ directory.
# Trigger: push to dev branch
# ============================================================
#
# ── WHERE TO ENTER CREDENTIALS ──────────────────────────────
#
# 1. CLOUD BUILD TRIGGER SUBSTITUTIONS (set in GCP Console →
#    Cloud Build → Triggers → Edit → Substitution variables):
#
#      _FIREBASE_PROJECT_ID      = simpletort-zadroga-dev
#      _CLOUD_TASKS_HANDLER_URL  = https://<cloud-run-url>   ← get after first deploy
#      _REGION                   = us-central1               ← or change if needed
#      _SERVICE_NAME             = lead-intake
#
# 2. SECRET MANAGER (create once via GCP Console →
#    Security → Secret Manager → + Create Secret):
#
#      SENDGRID_API_KEY
#      TWILIO_ACCOUNT_SID
#      TWILIO_AUTH_TOKEN
#      TWILIO_PHONE_NUMBER
#      VITE_FIREBASE_API_KEY
#      VITE_FIREBASE_AUTH_DOMAIN
#      VITE_FIREBASE_STORAGE_BUCKET
#      VITE_FIREBASE_MESSAGING_SENDER_ID
#      VITE_FIREBASE_APP_ID
#
# 3. IAM — grant the Cloud Build service account these roles
#    (GCP Console → IAM → <PROJECT_NUMBER>@cloudbuild.gserviceaccount.com):
#
#      roles/run.admin
#      roles/cloudfunctions.admin
#      roles/cloudscheduler.admin
#      roles/iam.serviceAccountUser
#      roles/secretmanager.secretAccessor
#      roles/firebasehosting.admin
#      roles/storage.admin          ← needed to push Docker images
#
# 4. SERVICE ACCOUNT for Cloud Run & Functions — create once:
#      gcloud iam service-accounts create lead-intake-service-account \
#        --display-name="Lead Intake Service Account"
#    Then grant it:
#      roles/datastore.user
#      roles/pubsub.publisher
#      roles/pubsub.subscriber
#      roles/cloudtasks.enqueuer
#      roles/secretmanager.secretAccessor
# ============================================================

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: lead-intake
  _FIREBASE_PROJECT_ID: ""        # ← SET IN TRIGGER
  _CLOUD_TASKS_HANDLER_URL: ""    # ← SET IN TRIGGER (Cloud Run URL, no trailing slash)

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

timeout: 1800s

steps:

  # ── STEP 1: UNIT TESTS ──────────────────────────────────────────────────────
  # Fixes a syntax error in test_vcf_screener.py (from __future__ must come
  # before other imports), installs all deps including functions-framework,
  # then runs all unit tests.

  - name: python:3.12-slim
    id: unit-tests
    dir: services/lead-intake
    entrypoint: bash
    args:
      - -c
      - |
        set -e

        # Fix __future__ import SyntaxError across ALL Python files.
        # Handles two cases:
        #   1. "from __future__ import annotations" appears mid-file (not line 1)
        #   2. It appears multiple times (duplicate)
        # Strategy: for every .py file, if the line exists anywhere past line 1,
        # remove all mid-file occurrences and ensure line 1 has exactly one.
        find . -name "*.py" | while read f; do
          FIRST_LINE=$(head -1 "$$f")
          MID_COUNT=$(tail -n +2 "$$f" | grep -c '^from __future__ import annotations$$' 2>/dev/null || true)
          if [ "$$MID_COUNT" -gt 0 ]; then
            echo "Fixing __future__ in $$f ($$MID_COUNT mid-file occurrence(s))"
            # Remove all occurrences from line 2 onwards
            HEAD=$(head -1 "$$f")
            BODY=$(tail -n +2 "$$f" | grep -v '^from __future__ import annotations$$')
            # Ensure line 1 is the __future__ import (add it if it wasn't already there)
            if echo "$$HEAD" | grep -q '^from __future__ import annotations$$'; then
              printf '%s\n%s\n' "$$HEAD" "$$BODY" > "$$f"
            else
              printf 'from __future__ import annotations\n%s\n%s\n' "$$HEAD" "$$BODY" > "$$f"
            fi
          fi
        done

        # Install API deps + test deps + functions-framework (needed by vcf_screener)
        pip install --no-cache-dir --break-system-packages -q \
          -r api/requirements.txt \
          functions-framework==3.8.2 \
          pytest==8.3.5 \
          pytest-asyncio==1.0.0 \
          pytest-mock==3.15.0 \
          pytest-cov==6.1.0 \
          httpx==0.28.1

        # Run unit tests
        pytest tests/unit/ -v --tb=short
        echo "✅ Unit tests passed"
    env:
      - PYTHONPATH=/workspace/services/lead-intake/api:/workspace/services/lead-intake/functions/vcf_screener
      - GCP_PROJECT_ID=test-project
      - APP_ENV=test
      - VCF_WINDOW_START=2001-09-11
      - VCF_WINDOW_END=2011-05-30
      - JWT_AUDIENCE=test-audience
      - JWT_ISSUER=https://test-issuer.example.com
      - JWKS_URI=https://test.example.com/.well-known/jwks.json
      - CLOUD_TASKS_HANDLER_URL=https://test.example.com
      - RATE_LIMIT_REQUESTS=100
      - FOLLOWUP_DELAY_HOURS=48

  # ── STEP 2: INTEGRATION TESTS ───────────────────────────────────────────────

  - name: python:3.12-slim
    id: integration-tests
    dir: services/lead-intake
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --no-cache-dir --break-system-packages -q \
          -r api/requirements.txt \
          pytest==8.3.5 \
          pytest-asyncio==1.0.0 \
          pytest-mock==3.15.0 \
          httpx==0.28.1

        pytest tests/integration/ -v --tb=short
        echo "✅ Integration tests passed"
    waitFor: [unit-tests]
    env:
      - PYTHONPATH=/workspace/services/lead-intake/api
      - GCP_PROJECT_ID=test-project
      - APP_ENV=test
      - VCF_WINDOW_START=2001-09-11
      - VCF_WINDOW_END=2011-05-30
      - JWT_AUDIENCE=test-audience
      - JWT_ISSUER=https://test-issuer.example.com
      - JWKS_URI=https://test.example.com/.well-known/jwks.json
      - CLOUD_TASKS_HANDLER_URL=https://test.example.com
      - RATE_LIMIT_REQUESTS=100

  # ── STEP 3: BUILD DOCKER IMAGE ──────────────────────────────────────────────

  - name: gcr.io/cloud-builders/docker
    id: build-image
    dir: services/lead-intake
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest
      - .
    waitFor: [integration-tests]

  # ── STEP 4: PUSH DOCKER IMAGE ───────────────────────────────────────────────

  - name: gcr.io/cloud-builders/docker
    id: push-image
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}
    waitFor: [build-image]

  # ── STEP 5: DEPLOY CLOUD RUN ────────────────────────────────────────────────

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cloud-run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,APP_ENV=development,JWT_AUDIENCE=${_FIREBASE_PROJECT_ID},JWT_ISSUER=https://securetoken.google.com/${_FIREBASE_PROJECT_ID},CLOUD_TASKS_HANDLER_URL=${_CLOUD_TASKS_HANDLER_URL},CLOUD_TASKS_LOCATION=${_REGION},PUBSUB_LEAD_CREATED_TOPIC=lead-created-dev,PUBSUB_LEAD_SCREENED_TOPIC=lead-screened-dev,CLOUD_TASKS_SA_EMAIL=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=SENDGRID_API_KEY=SENDGRID_API_KEY:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_FROM_NUMBER=TWILIO_PHONE_NUMBER:latest
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --timeout=30
    waitFor: [push-image]

  # ── STEP 6a: DEPLOY VCF SCREENER FUNCTION ───────────────────────────────────

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-vcf-screener
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - vcf-screener
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/vcf_screener
      - --entry-point=vcf_screener
      - --trigger-topic=lead-created-dev
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases,PUBSUB_LEAD_SCREENED_TOPIC=lead-screened-dev
      - --memory=256Mi
      - --timeout=60s
      - --min-instances=0
      - --max-instances=3
    waitFor: [integration-tests]

  # ── STEP 6b: DEPLOY NOTIFICATION DISPATCHER FUNCTION ────────────────────────

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-notification-dispatcher
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - notification-dispatcher
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/notification_dispatcher
      - --entry-point=notification_dispatcher
      - --trigger-topic=lead-screened-dev
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases
      - --memory=256Mi
      - --timeout=60s
      - --min-instances=0
      - --max-instances=3
    waitFor: [integration-tests]

  # ── STEP 6c: DEPLOY FOLLOWUP MONITOR FUNCTION ───────────────────────────────

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-followup-monitor
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - followup-monitor
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/followup_monitor
      - --entry-point=followup_monitor
      - --trigger-http
      - --no-allow-unauthenticated
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases,FOLLOWUP_DELAY_HOURS=48
      - --memory=256Mi
      - --timeout=120s
      - --min-instances=0
      - --max-instances=2
    waitFor: [integration-tests]

  # ── STEP 7: SETUP CLOUD SCHEDULER ───────────────────────────────────────────
  # Creates or updates the scheduler job (create fails silently, update runs)

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: setup-scheduler
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        FUNCTION_URL=$$(gcloud functions describe followup-monitor \
          --region=${_REGION} --gen2 --format='value(serviceConfig.uri)')

        gcloud scheduler jobs create http followup-monitor \
          --location=${_REGION} \
          --schedule="0 * * * *" \
          --uri="$$FUNCTION_URL" \
          --http-method=POST \
          --message-body='{}' \
          --oidc-service-account-email=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com \
          --oidc-token-audience="$$FUNCTION_URL" \
          2>/dev/null \
        || gcloud scheduler jobs update http followup-monitor \
          --location=${_REGION} \
          --schedule="0 * * * *" \
          --uri="$$FUNCTION_URL" \
          --http-method=POST \
          --message-body='{}' \
          --oidc-service-account-email=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com \
          --oidc-token-audience="$$FUNCTION_URL"

        echo "✅ Scheduler configured"
    waitFor: [deploy-followup-monitor]

  # ── STEP 8: INSTALL ADMIN UI DEPS ───────────────────────────────────────────
  # Starts immediately in parallel — no need to wait for tests

  - name: node:20-slim
    id: install-admin-ui-deps
    dir: services/lead-intake/admin_ui
    entrypoint: npm
    args: [install, --quiet]
    waitFor: [-]

  # ── STEP 9: BUILD ADMIN UI ───────────────────────────────────────────────────

  - name: node:20-slim
    id: build-admin-ui
    dir: services/lead-intake/admin_ui
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY \
        VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN \
        VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID} \
        VITE_FIREBASE_STORAGE_BUCKET=$$VITE_FIREBASE_STORAGE_BUCKET \
        VITE_FIREBASE_MESSAGING_SENDER_ID=$$VITE_FIREBASE_MESSAGING_SENDER_ID \
        VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID \
        npm run build
        echo "✅ Admin UI built"
    waitFor: [install-admin-ui-deps]
    secretEnv:
      - VITE_FIREBASE_API_KEY
      - VITE_FIREBASE_AUTH_DOMAIN
      - VITE_FIREBASE_STORAGE_BUCKET
      - VITE_FIREBASE_MESSAGING_SENDER_ID
      - VITE_FIREBASE_APP_ID

  # ── STEP 10: DEPLOY FIREBASE HOSTING ────────────────────────────────────────
  # Uses Cloud Build service account IAM auth — NO token needed.
  # Grant the Cloud Build SA: roles/firebasehosting.admin

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-firebase-hosting
    dir: services/lead-intake/admin_ui
    entrypoint: bash
    args:
    - -c
    - |
      set -e
      # Install firebase-tools via standalone binary (no npm needed)
      curl -sL https://firebase.tools | bash
      firebase deploy --only hosting \
        --project=${_FIREBASE_PROJECT_ID} \
        --non-interactive
      echo "✅ Admin UI deployed to Firebase Hosting"
    waitFor: [build-admin-ui]

# ── SECRETS FROM SECRET MANAGER ─────────────────────────────────────────────
# All secrets must be created in Secret Manager BEFORE the first build runs.

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_API_KEY/versions/latest
      env: VITE_FIREBASE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_AUTH_DOMAIN/versions/latest
      env: VITE_FIREBASE_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_STORAGE_BUCKET/versions/latest
      env: VITE_FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: VITE_FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_APP_ID/versions/latest
      env: VITE_FIREBASE_APP_ID

images:
  - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest