# cloudbuild/cloudbuild.dev.yaml
#
# PURPOSE:  Dev environment CI/CD pipeline
# TRIGGER:  Push to `develop` branch (or any branch matching `feature/*`, `fix/*`)
# DEPLOYS:  Cloud Run to zad-lead-intake-dev
#           Cloud Functions with -dev suffix
#           Admin UI to Firebase Hosting preview channel
#
# HOW TO CONNECT TO GITHUB:
#   1. Go to GCP Console → Cloud Build → Triggers → Connect Repository
#   2. Select GitHub, authenticate, pick your repo
#   3. Create trigger:
#        Name:   zad-dev-deploy
#        Event:  Push to branch
#        Branch: ^develop$  (or ^(develop|feature/.*)$ for feature branches too)
#        Config: cloudbuild/cloudbuild.dev.yaml
#   4. Add substitution variable: _GCP_PROJECT_ID = your-dev-project-id
#
# BRANCH STRATEGY:
#   develop  →  this file   → dev environment
#   main     →  cloudbuild.prod.yaml → production
#   PR       →  cloudbuild.pr.yaml  → tests only, no deploy

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: lead-intake        # dev-suffixed service name
  _REPO: Zadroga-Case-Management
  _ENV: development
  _FIREBASE_CHANNEL: dev                    # Firebase Hosting preview channel name
  _CLOUD_TASKS_HANDLER_URL: ""             # Set this in trigger substitutions
  _JWT_AUDIENCE: ""                         # Set this in trigger substitutions
  _DEFAULT_ASSIGNEE_EMAIL: "aditya@plutusllp.com"  # Default follow-up task assignee

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE           # Don't fail on unused substitutions

# ── Timeout for the full pipeline ──────────────────────────────────────────────
timeout: 1800s  # 30 minutes max

steps:

  # ════════════════════════════════════════════════════════════════
  # STAGE 1: DEPENDENCIES + TESTS  (fail fast before building)
  # ════════════════════════════════════════════════════════════════

  # NOTE: Cloud Build runs each step in a SEPARATE container.
  # Pip packages installed in one step are NOT available in the next step
  # (only /workspace is shared between steps). Each test step must install
  # its own dependencies.

  - name: python:3.12-slim
    id: install-python-deps
    dir: services/lead-intake
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        echo "▶ Pre-flight: verifying all requirements files exist..."
        ls api/requirements.txt \
           functions/vcf_screener/requirements.txt \
           functions/notification_dispatcher/requirements.txt \
           functions/followup_monitor/requirements.txt
        echo "✅ All requirements files found"

  - name: python:3.12-slim
    id: lint
    dir: services/lead-intake
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        echo "▶ Running linter (auto-fix then enforce)..."
        pip install --no-cache-dir --break-system-packages -q ruff
        ruff check api/ functions/ --select=E,W,F --ignore=E501 --fix --unsafe-fixes
        ruff check api/ functions/ --select=E,W,F --ignore=E501
        echo "✅ Lint passed"
    waitFor: [install-python-deps]

  - name: python:3.12-slim
    id: unit-tests
    dir: services/lead-intake
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        echo "▶ Installing deps for unit tests (fresh container — must reinstall)..."
        pip install --no-cache-dir --break-system-packages -q \
          -r api/requirements.txt \
          -r functions/vcf_screener/requirements.txt \
          -r functions/notification_dispatcher/requirements.txt \
          -r functions/followup_monitor/requirements.txt \
          pytest pytest-asyncio pytest-mock httpx pytest-cov
        echo "▶ Running unit tests..."
        mkdir -p test-results
        pytest tests/unit/ \
          -v \
          --tb=short \
          --junit-xml=test-results/unit.xml \
          --cov=functions \
          --cov=api/models \
          --cov=api/services/validation.py \
          --cov-report=term-missing \
          --cov-fail-under=70
        echo "✅ Unit tests passed"
    waitFor: [install-python-deps]
    env:
      - PYTHONPATH=/workspace/services/lead-intake/api:/workspace/services/lead-intake/functions
      - GCP_PROJECT_ID=test-project
      - APP_ENV=test
      - VCF_WINDOW_START=2001-09-11
      - VCF_WINDOW_END=2011-05-30

  - name: python:3.12-slim
    id: integration-tests
    dir: services/lead-intake
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        echo "▶ Installing deps for integration tests (fresh container — must reinstall)..."
        pip install --no-cache-dir --break-system-packages -q \
          -r api/requirements.txt \
          -r functions/vcf_screener/requirements.txt \
          -r functions/notification_dispatcher/requirements.txt \
          -r functions/followup_monitor/requirements.txt \
          pytest pytest-asyncio pytest-mock httpx pytest-cov
        echo "▶ Running integration tests (mocked)..."
        pytest tests/integration/ \
          -v \
          --tb=short \
          --junit-xml=test-results/integration.xml
        echo "✅ Integration tests passed"
    waitFor: [unit-tests]
    env:
      - PYTHONPATH=/workspace/services/lead-intake/api:/workspace/services/lead-intake/functions
      - GCP_PROJECT_ID=test-project
      - APP_ENV=test
      - VCF_WINDOW_START=2001-09-11
      - VCF_WINDOW_END=2011-05-30
      - JWT_AUDIENCE=test-audience
      - JWT_ISSUER=https://test-issuer.example.com
      - JWKS_URI=https://test.example.com/.well-known/jwks.json
      - CLOUD_TASKS_HANDLER_URL=https://test.example.com
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW_SECONDS=60
      - FOLLOWUP_DELAY_HOURS=48

  # ════════════════════════════════════════════════════════════════
  # STAGE 2: BUILD DOCKER IMAGE
  # ════════════════════════════════════════════════════════════════

  - name: gcr.io/cloud-builders/docker
    id: build-image
    dir: services/lead-intake                 # FIX 5: build context must be service root so COPY api/ works
    args:
      - build
      - -f
      - Dockerfile
      - --build-arg
      - BUILD_ENV=development
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:dev-latest
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:dev-$BRANCH_NAME
      - .
    waitFor: [integration-tests]

  # ════════════════════════════════════════════════════════════════
  # STAGE 3: PUSH TO ARTIFACT REGISTRY
  # ════════════════════════════════════════════════════════════════

  - name: gcr.io/cloud-builders/docker
    id: push-image
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}
    waitFor: [build-image]

  # ════════════════════════════════════════════════════════════════
  # STAGE 4: DEPLOY CLOUD RUN (dev)
  # Runs in parallel with Cloud Function deploys after push
  # ════════════════════════════════════════════════════════════════

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cloud-run-dev
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,APP_ENV=${_ENV},CLOUD_TASKS_HANDLER_URL=${_CLOUD_TASKS_HANDLER_URL},JWT_AUDIENCE=${_JWT_AUDIENCE},PARTNER_AUTH_ENABLED=true
      - --set-secrets=SENDGRID_API_KEY=SENDGRID_API_KEY:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest
      - --min-instances=0          # scale to zero in dev to save cost
      - --max-instances=5
      - --memory=512Mi
      - --cpu=1
      - --concurrency=80
      - --timeout=30
      - --tag=dev-$SHORT_SHA       # named revision for easy rollback
      - --revision-suffix=dev-$SHORT_SHA
    waitFor: [push-image]

  # ════════════════════════════════════════════════════════════════
  # STAGE 5: DEPLOY CLOUD FUNCTIONS (dev) — parallel after tests
  # ════════════════════════════════════════════════════════════════

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-vcf-screener-dev
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - vcf-screener-dev                    # dev-suffixed function name
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/vcf_screener  # FIX 6: gcloud runs from repo root
      - --entry-point=vcf_screener
      - --trigger-topic=lead-created-dev    # dev topic — separate from prod
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases-dev,PUBSUB_LEAD_SCREENED_TOPIC=lead-screened-dev
      - --memory=256Mi
      - --timeout=60s
      - --min-instances=0
      - --max-instances=3
    waitFor: [integration-tests]    # deploy functions in parallel with docker

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-notification-dispatcher-dev
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - notification-dispatcher-dev
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/notification_dispatcher  # FIX 6 (continued)
      - --entry-point=notification_dispatcher
      - --trigger-topic=lead-screened-dev
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases-dev
      - --memory=256Mi
      - --timeout=60s
      - --min-instances=0
      - --max-instances=3
    waitFor: [integration-tests]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-followup-monitor-dev
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - followup-monitor-dev
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/followup_monitor  # FIX 6 (continued)
      - --entry-point=followup_monitor
      - --trigger-http
      - --no-allow-unauthenticated
      - --service-account=followup-monitor-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases-dev,FOLLOWUP_DELAY_HOURS=48,DEFAULT_ASSIGNEE_EMAIL=${_DEFAULT_ASSIGNEE_EMAIL}
      - --memory=256Mi
      - --timeout=120s
      - --min-instances=0
      - --max-instances=2
    waitFor: [integration-tests]

  # Create Cloud Scheduler job for hourly follow-up monitor (idempotent)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: create-followup-scheduler-dev
    entrypoint: bash
    args:
      - -c
      - |
        echo "▶ Ensuring Cloud Scheduler job for followup-monitor-dev..."
        FUNCTION_URL=$$(gcloud functions describe followup-monitor-dev \
          --region=${_REGION} \
          --gen2 \
          --format='value(serviceConfig.uri)' 2>/dev/null || echo "")

        if [ -z "$$FUNCTION_URL" ]; then
          echo "⚠ Could not get function URL, skipping scheduler setup"
          exit 0
        fi

        # Create or update the scheduler job
        gcloud scheduler jobs create http followup-monitor-hourly-dev \
          --location=${_REGION} \
          --schedule="0 * * * *" \
          --uri="$$FUNCTION_URL" \
          --http-method=POST \
          --message-body='{}' \
          --oidc-service-account-email=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com \
          --oidc-token-audience="$$FUNCTION_URL" \
          --description="Hourly follow-up monitor for non-responsive leads (dev)" \
          2>/dev/null || \
        gcloud scheduler jobs update http followup-monitor-hourly-dev \
          --location=${_REGION} \
          --schedule="0 * * * *" \
          --uri="$$FUNCTION_URL" \
          --http-method=POST \
          --message-body='{}' \
          --oidc-service-account-email=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com \
          --oidc-token-audience="$$FUNCTION_URL" \
          2>/dev/null || true

        echo "✅ Cloud Scheduler job configured"
    waitFor: [deploy-followup-monitor-dev]

  # ════════════════════════════════════════════════════════════════
  # STAGE 6: BUILD + DEPLOY ADMIN UI (dev preview channel)
  # Runs in parallel from the start — no dependency on Docker
  # ════════════════════════════════════════════════════════════════

  - name: node:20-slim
    id: install-admin-ui-deps
    dir: services/lead-intake/admin_ui        # FIX 7: correct path — no cd needed
    entrypoint: bash
    args:
      - -c
      - |
        echo "▶ Installing Admin UI deps..."
        npm install --quiet                   # FIX 8: npm ci fails without package-lock.json; use npm install
        echo "✅ Admin UI deps installed"
    waitFor: [-]   # start immediately, parallel with everything

  - name: node:20-slim
    id: build-admin-ui-dev
    dir: services/lead-intake/admin_ui        # FIX 7 (continued)
    entrypoint: bash
    args:
      - -c
      - |
        echo "▶ Building Admin UI for dev..."
        VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY \
        VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN \
        VITE_FIREBASE_PROJECT_ID=$PROJECT_ID \
        VITE_FIREBASE_STORAGE_BUCKET=$$VITE_FIREBASE_STORAGE_BUCKET \
        VITE_FIREBASE_MESSAGING_SENDER_ID=$$VITE_FIREBASE_MESSAGING_SENDER_ID \
        VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID \
        npm run build
        echo "✅ Admin UI built"
    waitFor: [install-admin-ui-deps]
    secretEnv:
      - VITE_FIREBASE_API_KEY
      - VITE_FIREBASE_AUTH_DOMAIN
      - VITE_FIREBASE_STORAGE_BUCKET
      - VITE_FIREBASE_MESSAGING_SENDER_ID
      - VITE_FIREBASE_APP_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-firebase-hosting-dev
    dir: services/lead-intake/admin_ui        # FIX 7 (continued): firebase CLI needs firebase.json in cwd
    entrypoint: bash
    args:
      - -c
      - |
        echo "▶ Deploying to Firebase Hosting dev preview channel..."
        npm install -g firebase-tools --quiet
        # Deploy to a named preview channel (not live channel)
        # Preview URL: https://zad-admin--dev-XXXXXXXX.web.app
        firebase hosting:channel:deploy ${_FIREBASE_CHANNEL} \
          --project=$PROJECT_ID \
          --token=$$FIREBASE_TOKEN \
          --expires=7d
        echo "✅ Firebase Hosting dev channel deployed"
    secretEnv: [FIREBASE_TOKEN]
    waitFor: [build-admin-ui-dev]

  # ════════════════════════════════════════════════════════════════
  # STAGE 7: SMOKE TEST (after all deploys)
  # Hits the /health endpoint of the newly deployed Cloud Run service
  # ════════════════════════════════════════════════════════════════

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: smoke-test
    entrypoint: bash
    waitFor:
      - deploy-cloud-run-dev
      - deploy-vcf-screener-dev
      - deploy-notification-dispatcher-dev
      - deploy-firebase-hosting-dev
      - create-followup-scheduler-dev
    args:
      - -c
      - |
        echo "▶ Running smoke test..."

        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} \
          --format='value(status.url)')

        echo "Service URL: $$SERVICE_URL"

        HTTP_STATUS=$$(curl -s -o /dev/null -w "%{http_code}" "$$SERVICE_URL/health")

        echo "Health check HTTP status: $$HTTP_STATUS"

        if [ "$$HTTP_STATUS" != "200" ]; then
          echo "❌ Smoke test FAILED — /health returned $$HTTP_STATUS"
          exit 1
        fi

        echo "✅ Smoke test passed"

# ── Secrets from Secret Manager ───────────────────────────────────────────────
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_CI_TOKEN/versions/latest
      env: FIREBASE_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_API_KEY/versions/latest
      env: VITE_FIREBASE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_AUTH_DOMAIN/versions/latest
      env: VITE_FIREBASE_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_STORAGE_BUCKET/versions/latest
      env: VITE_FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: VITE_FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_APP_ID/versions/latest
      env: VITE_FIREBASE_APP_ID

# ── Artifact: push image to registry ─────────────────────────────────────────
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:dev-latest
