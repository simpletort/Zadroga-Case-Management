steps:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  - name: "python:3.12-slim"
    dir: "services/lead-intake"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install /workspace/shared/ --quiet --break-system-packages
        pip install -r api/requirements.txt \
                    pytest==8.3.5 \
                    pytest-asyncio==1.0.0 \
                    pytest-mock==3.15.0 \
                    httpx==0.28.1 \
                    --quiet --break-system-packages
        pytest tests/ -v --tb=short
    env:
      - "PYTHONPATH=/workspace/services/lead-intake/api"
      - "GCP_PROJECT_ID=simpletort-zadroga-dev"
      - "FIREBASE_PROJECT_ID=simpletort-zadroga-dev"
      - "APP_ENV=test"
      - "JWT_AUDIENCE=test-audience"
      - "JWT_ISSUER=https://test-issuer.example.com"
      - "JWKS_URI=https://test.example.com/.well-known/jwks.json"
      - "CLOUD_TASKS_HANDLER_URL=https://lead-intake-dev.run.app"
      - "CLOUD_TASKS_QUEUE_REGION=us-central1"
      - "RATE_LIMIT_REQUESTS=100"
      - "FOLLOWUP_DELAY_HOURS=48"

  # ── 2. Build (context = repo root so Dockerfile can COPY shared/) ───────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "-t"
      - "$_REPO/$_SERVICE_NAME:latest"
      - "-f"
      - "services/lead-intake/Dockerfile"
      - "."

  # ── 3. Push ──────────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:latest"]

  # ── 4. Deploy ────────────────────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=lead-intake-service-account@simpletort-zadroga-dev.iam.gserviceaccount.com"
      - "--set-env-vars=^|^GCP_PROJECT_ID=$PROJECT_ID|ENV=$_ENV|APP_ENV=$_ENV|FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID|JWT_AUDIENCE=$_FIREBASE_PROJECT_ID|JWT_ISSUER=https://securetoken.google.com/$_FIREBASE_PROJECT_ID|CLOUD_TASKS_HANDLER_URL=$_CLOUD_TASKS_HANDLER_URL|CLOUD_TASKS_LOCATION=$_REGION|CLOUD_TASKS_QUEUE_REGION=$_REGION|CLOUD_TASKS_SA_EMAIL=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com|PUBSUB_LEAD_CREATED_TOPIC=lead-created-$_ENV|PUBSUB_LEAD_SCREENED_TOPIC=lead-screened-$_ENV|PUBSUB_LEAD_FOLLOWUP_TOPIC=lead-followup-$_ENV|TRUSTED_SERVICE_ACCOUNTS=$_TRUSTED_SERVICE_ACCOUNTS|SSN_KMS_KEY_NAME=$_SSN_KMS_KEY_NAME"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--max-instances=10"
      - "--min-instances=0"

substitutions:
  _TRUSTED_SERVICE_ACCOUNTS: >-
    292736139819-compute@developer.gserviceaccount.com
  _SSN_KMS_KEY_NAME: >-
    projects/simpletort-zadroga-dev/locations/us/keyRings/simpletort-phi/cryptoKeys/ssn-cmek

images:
  - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
  - "$_REPO/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
