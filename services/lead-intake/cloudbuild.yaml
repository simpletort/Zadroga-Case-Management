# cloudbuild.yaml — Lead Intake CI/CD pipeline
# Trigger: push to dev branch
# Deploys: Cloud Run, 3 Cloud Functions, Admin UI to Firebase Hosting

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: lead-intake
  _REPO: Zadroga-Case-Management
  _ENV: development
  _FIREBASE_PROJECT_ID: ""        # Set in trigger: simpletort-zadroga-dev
  _CLOUD_TASKS_HANDLER_URL: ""    # Set in trigger: Cloud Run service URL (get after first deploy)
  _DEFAULT_ASSIGNEE_EMAIL: "aditya@plutusllp.com"

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

timeout: 1800s

steps:
 
  # ── 1. UNIT TESTS ─────────────────────────────────────────────────────────

  - name: python:3.12-slim
    id: unit-tests
    dir: services/lead-intake
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --no-cache-dir --break-system-packages -q \
          -r api/requirements.txt \
          pytest pytest-asyncio pytest-mock httpx pytest-cov
        pytest tests/unit/ -v --tb=short --cov=api/models --cov-fail-under=70
        echo "✅ Unit tests passed"
    env:
      - PYTHONPATH=/workspace/services/lead-intake/api
      - GCP_PROJECT_ID=test-project
      - APP_ENV=test
      - VCF_WINDOW_START=2001-09-11
      - VCF_WINDOW_END=2011-05-30

  # ── 2. INTEGRATION TESTS ──────────────────────────────────────────────────

  - name: python:3.12-slim
    id: integration-tests
    dir: services/lead-intake
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --no-cache-dir --break-system-packages -q \
          -r api/requirements.txt \
          pytest pytest-asyncio pytest-mock httpx
        pytest tests/integration/ -v --tb=short
        echo "✅ Integration tests passed"
    waitFor: [unit-tests]
    env:
      - PYTHONPATH=/workspace/services/lead-intake/api
      - GCP_PROJECT_ID=test-project
      - APP_ENV=test
      - VCF_WINDOW_START=2001-09-11
      - VCF_WINDOW_END=2011-05-30
      - JWT_AUDIENCE=test-audience
      - JWT_ISSUER=https://test-issuer.example.com
      - JWKS_URI=https://test.example.com/.well-known/jwks.json
      - CLOUD_TASKS_HANDLER_URL=https://test.example.com
  
  # ── 3. BUILD + PUSH DOCKER IMAGE ──────────────────────────────────────────

  - name: gcr.io/cloud-builders/docker
    id: build-image
    dir: services/lead-intake
    args:
      - build
      - -t
      - $_REPO/$_SERVICE_NAME:$COMMIT_SHA
      - -t
      - $_REPO/$_SERVICE_NAME:latest
      - .
    waitFor: [integration-tests]

  - name: gcr.io/cloud-builders/docker
    id: push-image
    args:
      - push
      - --all-tags
      - $_REPO/$_SERVICE_NAME
    waitFor: [build-image]

  # ── 4. DEPLOY CLOUD RUN ───────────────────────────────────────────────────

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cloud-run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,APP_ENV=${_ENV},JWT_AUDIENCE=${_FIREBASE_PROJECT_ID},JWT_ISSUER=https://securetoken.google.com/${_FIREBASE_PROJECT_ID},CLOUD_TASKS_HANDLER_URL=${_CLOUD_TASKS_HANDLER_URL}
      - --set-secrets=SENDGRID_API_KEY=SENDGRID_API_KEY:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_FROM_NUMBER=TWILIO_PHONE_NUMBER:latest
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --timeout=30
    waitFor: [push-image]

  # ── 5. DEPLOY CLOUD FUNCTIONS (parallel) ──────────────────────────────────

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-vcf-screener
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - vcf-screener-dev
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/vcf_screener
      - --entry-point=vcf_screener
      - --trigger-topic=lead-created-dev
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases,PUBSUB_LEAD_SCREENED_TOPIC=lead-screened-dev
      - --memory=256Mi
      - --timeout=60s
      - --min-instances=0
      - --max-instances=3
    waitFor: [integration-tests]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-notification-dispatcher
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - notification-dispatcher-dev
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/notification_dispatcher
      - --entry-point=notification_dispatcher
      - --trigger-topic=lead-screened-dev
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases
      - --memory=256Mi
      - --timeout=60s
      - --min-instances=0
      - --max-instances=3
    waitFor: [integration-tests]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-followup-monitor
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - followup-monitor-dev
      - --gen2
      - --region=${_REGION}
      - --runtime=python312
      - --source=services/lead-intake/functions/followup_monitor
      - --entry-point=followup_monitor
      - --trigger-http
      - --no-allow-unauthenticated
      - --service-account=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_CASES_COLLECTION=cases,FOLLOWUP_DELAY_HOURS=48,DEFAULT_ASSIGNEE_EMAIL=${_DEFAULT_ASSIGNEE_EMAIL}
      - --memory=256Mi
      - --timeout=120s
      - --min-instances=0
      - --max-instances=2
    waitFor: [integration-tests]

  # ── 6. CLOUD SCHEDULER for followup monitor ───────────────────────────────

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: setup-scheduler
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        FUNCTION_URL=$$(gcloud functions describe followup-monitor-dev \
          --region=${_REGION} --gen2 --format='value(serviceConfig.uri)')

        gcloud scheduler jobs create http followup-monitor-dev \
          --location=${_REGION} \
          --schedule="0 * * * *" \
          --uri="$$FUNCTION_URL" \
          --http-method=POST \
          --message-body='{}' \
          --oidc-service-account-email=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com \
          --oidc-token-audience="$$FUNCTION_URL" \
          2>/dev/null \
        || gcloud scheduler jobs update http followup-monitor-dev \
          --location=${_REGION} \
          --schedule="0 * * * *" \
          --uri="$$FUNCTION_URL" \
          --http-method=POST \
          --message-body='{}' \
          --oidc-service-account-email=lead-intake-service-account@$PROJECT_ID.iam.gserviceaccount.com \
          --oidc-token-audience="$$FUNCTION_URL"

        echo "✅ Scheduler configured"
    waitFor: [deploy-followup-monitor]

  # ── 7. BUILD + DEPLOY ADMIN UI ────────────────────────────────────────────

  - name: node:20-slim
    id: install-admin-ui-deps
    dir: services/lead-intake/admin_ui
    entrypoint: bash
    args:
      - -c
      - |
        npm install --quiet
        echo "✅ Admin UI deps installed"
    waitFor: [-]

  - name: node:20-slim
    id: build-admin-ui
    dir: services/lead-intake/admin_ui
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY \
        VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN \
        VITE_FIREBASE_PROJECT_ID=$PROJECT_ID \
        VITE_FIREBASE_STORAGE_BUCKET=$$VITE_FIREBASE_STORAGE_BUCKET \
        VITE_FIREBASE_MESSAGING_SENDER_ID=$$VITE_FIREBASE_MESSAGING_SENDER_ID \
        VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID \
        npm run build
        echo "✅ Admin UI built"
    waitFor: [install-admin-ui-deps]
    secretEnv:
      - VITE_FIREBASE_API_KEY
      - VITE_FIREBASE_AUTH_DOMAIN
      - VITE_FIREBASE_STORAGE_BUCKET
      - VITE_FIREBASE_MESSAGING_SENDER_ID
      - VITE_FIREBASE_APP_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-firebase-hosting
    dir: services/lead-intake/admin_ui
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm install -g firebase-tools --quiet
        firebase deploy --only hosting \
          --project=$PROJECT_ID \
          --token=$$FIREBASE_TOKEN
        echo "✅ Admin UI deployed"
    secretEnv: [FIREBASE_TOKEN]
    waitFor: [build-admin-ui]

# ── Secrets ────────────────────────────────────────────────────────────────────

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_CI_TOKEN/versions/latest
      env: FIREBASE_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_API_KEY/versions/latest
      env: VITE_FIREBASE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_AUTH_DOMAIN/versions/latest
      env: VITE_FIREBASE_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_STORAGE_BUCKET/versions/latest
      env: VITE_FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: VITE_FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/VITE_FIREBASE_APP_ID/versions/latest
      env: VITE_FIREBASE_APP_ID

images:
  - $_REPO/$_SERVICE_NAME:$COMMIT_SHA
  - $_REPO/$_SERVICE_NAME:latest
