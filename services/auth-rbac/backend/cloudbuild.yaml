steps:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  - name: "python:3.11-slim"
    dir: "services/auth-rbac/backend/functions"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt \
                    pytest==8.3.5 \
                    pytest-mock==3.15.0 \
                    --quiet --break-system-packages
        pytest tests/ -v --tb=short
    env:
      - "PYTHONPATH=/workspace/services/auth-rbac/backend/functions"
      - "APP_ENV=test"

  # ── 2. Deploy Firebase Functions ──────────────────────────────────────────
  # Python + Node in one container so the venv's Python interpreter is
  # on the same PATH that Firebase CLI invokes to validate the SDK.
  # No Docker build/push — auth-rbac deploys as Firebase Cloud Functions.
  - name: "python:3.11-slim"
    dir: "services/auth-rbac/backend"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e

        # ── install Node 20 ──────────────────────────────────────────────────
        apt-get update -qq
        apt-get install -y curl --no-install-recommends -qq
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash - >/dev/null 2>&1
        apt-get install -y nodejs --no-install-recommends -qq

        # ── build venv with deps (firebase-functions SDK must be present) ───
        python -m venv functions/venv
        functions/venv/bin/pip install --quiet -r functions/requirements.txt

        # ── install Firebase CLI ─────────────────────────────────────────────
        npm install --quiet

        # ── deploy functions ─────────────────────────────────────────────────
        ./node_modules/.bin/firebase deploy --only functions \
          --project=$PROJECT_ID \
          --non-interactive
    env:
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"

  # ── 3. Deploy Firestore rules and indexes ─────────────────────────────────
  - name: "node:20-slim"
    dir: "services/auth-rbac/backend"
    entrypoint: bash
    args:
      - "-c"
      - |
        npm install --quiet
        ./node_modules/.bin/firebase deploy --only firestore:rules,firestore:indexes \
          --project=$PROJECT_ID \
          --non-interactive
    env:
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"

options:
  logging: CLOUD_LOGGING_ONLY
