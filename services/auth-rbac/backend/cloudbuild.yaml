steps:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  - name: "python:3.12-slim"
    dir: "services/auth-rbac/backend/functions"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt \
                    pytest==8.3.5 \
                    pytest-mock==3.15.0 \
                    --quiet --break-system-packages
        pytest tests/ -v --tb=short
    env:
      - "PYTHONPATH=/workspace/services/auth-rbac/backend/functions"
      - "APP_ENV=test"

  # ── 2. Install Firebase CLI ────────────────────────────────────────────────
  # No Docker build/push — auth-rbac deploys as Firebase Cloud Functions.
  - name: "node:20-slim"
    dir: "services/auth-rbac/backend"
    entrypoint: bash
    args:
      - "-c"
      - |
        npm install --quiet
        # Smoke-check: confirm firebase-tools is available
        ./node_modules/.bin/firebase --version

  # ── 3. Deploy Firebase Functions ──────────────────────────────────────────
  - name: "node:20-slim"
    dir: "services/auth-rbac/backend"
    entrypoint: bash
    args:
      - "-c"
      - |
        ./node_modules/.bin/firebase deploy --only functions \
          --project=$PROJECT_ID \
          --non-interactive
    env:
      # Cloud Build SA provides ADC automatically; no token needed.
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"

  # ── 4. Deploy Firestore rules and indexes ─────────────────────────────────
  - name: "node:20-slim"
    dir: "services/auth-rbac/backend"
    entrypoint: bash
    args:
      - "-c"
      - |
        ./node_modules/.bin/firebase deploy --only firestore:rules,firestore:indexes \
          --project=$PROJECT_ID \
          --non-interactive
    env:
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"

options:
  logging: CLOUD_LOGGING_ONLY
