steps:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  - name: "python:3.11-slim"
    dir: "services/auth-rbac/backend/functions"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt \
                    pytest==8.3.5 \
                    pytest-mock==3.15.0 \
                    --quiet --break-system-packages
        pytest tests/ -v --tb=short
    env:
      - "PYTHONPATH=/workspace/services/auth-rbac/backend/functions"
      - "APP_ENV=test"

  # ── 2. Build venv for Firebase CLI ───────────────────────────────────────
  # Firebase CLI requires a venv at functions/venv built with the runtime
  # Python version (python311). This step creates it and installs deps so
  # firebase deploy can analyse and package the source correctly.
  - name: "python:3.11-slim"
    dir: "services/auth-rbac/backend/functions"
    entrypoint: bash
    args:
      - "-c"
      - |
        python -m venv venv
        venv/bin/pip install --quiet -r requirements.txt

  # ── 3. Install Firebase CLI ────────────────────────────────────────────────
  # No Docker build/push — auth-rbac deploys as Firebase Cloud Functions.
  - name: "node:20-slim"
    dir: "services/auth-rbac/backend"
    entrypoint: bash
    args:
      - "-c"
      - |
        npm install --quiet
        # Smoke-check: confirm firebase-tools is available
        ./node_modules/.bin/firebase --version

  # ── 4. Deploy Firebase Functions ──────────────────────────────────────────
  - name: "node:20-slim"
    dir: "services/auth-rbac/backend"
    entrypoint: bash
    args:
      - "-c"
      - |
        ./node_modules/.bin/firebase deploy --only functions \
          --project=$PROJECT_ID \
          --non-interactive
    env:
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"

  # ── 5. Deploy Firestore rules and indexes ─────────────────────────────────
  - name: "node:20-slim"
    dir: "services/auth-rbac/backend"
    entrypoint: bash
    args:
      - "-c"
      - |
        ./node_modules/.bin/firebase deploy --only firestore:rules,firestore:indexes \
          --project=$PROJECT_ID \
          --non-interactive
    env:
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"

options:
  logging: CLOUD_LOGGING_ONLY
