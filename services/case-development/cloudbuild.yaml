steps:
  # 1. Test
  - name: 'python:3.11-slim'
    id: test
    dir: 'services/case-development'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install -r requirements.txt pytest --quiet
        pytest tests/ -v --tb=short

  # 2. Build image
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    dir: 'services/case-development'
    waitFor: ['test']
    args:
      - build
      - '-t'
      - '$_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_REPO/$_SERVICE_NAME:$_ENV-latest'
      - '.'

  # 3. Push image
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    waitFor: ['build']
    args: ['push', '--all-tags', '$_REPO/$_SERVICE_NAME']

  # 4. Deploy (dev -> direct via deploy.sh; prod -> canary via deploy.sh -> canary-deploy.sh)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: ['push']
    entrypoint: bash
    args:
      - '-c'
      - |
        bash scripts/deploy.sh           $_ENV           $_SERVICE_NAME           $_REPO           $COMMIT_SHA           $_REGION           $PROJECT_ID

images:
  - '$_REPO/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_REPO/$_SERVICE_NAME:$_ENV-latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
