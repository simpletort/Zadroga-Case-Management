substitutions:
  _SERVICE_NAME: lead-intake          # ← change per service
  _REGION: us-central1
  _REPO: us-central1-docker.pkg.dev/$PROJECT_ID/simpletort
  _ENV: dev                           # overridden by trigger (dev/staging/prod)

steps:
  # 1. Install dependencies
  - name: 'node:18-alpine'
    entrypoint: npm
    args: ['ci']
    dir: 'services/$_SERVICE_NAME'

  # 2. Lint
  - name: 'node:18-alpine'
    entrypoint: npm
    args: ['run', 'lint']
    dir: 'services/$_SERVICE_NAME'

  # 3. Unit tests
  - name: 'node:18-alpine'
    entrypoint: npm
    args: ['test', '--', '--coverage']
    dir: 'services/$_SERVICE_NAME'

  # 4. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '$_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_REPO/$_SERVICE_NAME:$_ENV-latest'
      - '-f'
      - 'services/$_SERVICE_NAME/Dockerfile'
      - 'services/$_SERVICE_NAME'

  # 5. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '$_REPO/$_SERVICE_NAME']

  # 6. Deploy to Cloud Run (skipped on PR builds via trigger filter)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE_NAME-$_ENV'
      - '--image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-env-vars=ENV=$_ENV'

images:
  - '$_REPO/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_REPO/$_SERVICE_NAME:$_ENV-latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: '1200s'

tags:
  - '$_SERVICE_NAME'
  - '$_ENV'
  - '$COMMIT_SHA'