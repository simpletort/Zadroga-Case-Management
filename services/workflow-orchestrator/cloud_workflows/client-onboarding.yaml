# SimpleTort - Client Onboarding Workflow
# Deployed as a GCP Cloud Workflow resource named: client-onboarding
#
# Arguments: { lead_id: string, case_id: string, client_email: string }
#
# Steps:
#   1. Fetch full lead record from Lead Intake Service
#   2. Set case status → "client_onboarding" in Case Development Service
#   3. Create client portal account
#   4. Send DocuSign retainer + build document checklist
#   5. Send welcome notifications (email + SMS)
#   6. Poll for retainer signature
#   7. On signed: update case status → "pending_paralegal_review", auto-assign paralegal
#   8. Trigger vcf-enrollment workflow

main:
  params: [args]
  steps:

    - init:
        assign:
          - lead_id: ${args.lead_id}
          - case_id: ${args.case_id}
          - client_email: ${args.client_email}
          - workflow_id: "client-onboarding"
          - deploy_env: ${sys.get_env("DEPLOY_ENV")}
          - lead_service_url: ${"https://lead-intake-" + deploy_env + "-" + default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed")}
          - case_dev_url: ${"https://case-development-" + deploy_env + "-" + default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed")}
          - portal_url: ${"https://client-portal-" + deploy_env + "-" + default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed")}
          - ext_sync_url: ${"https://external-sync-" + deploy_env + "-" + default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed")}
          - orchestrator_url: ${"https://workflow-orchestrator-" + deploy_env + "-" + default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed")}
          - notification_url: ${"https://notification-" + deploy_env + "-" + default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed")}

    # Fetch configurable step parameters from Firestore via the orchestrator.
    - fetch_step_config:
        call: http.get
        args:
          url: ${orchestrator_url + "/internal/workflow-step-config/" + workflow_id}
          auth:
            type: OIDC
        result: step_config_response

    - set_config:
        assign:
          - config: ${step_config_response.body}

    # Fetch the full lead record so subsequent steps have name, phone, and
    # intake metadata without requiring callers to duplicate those fields.
    - fetch_lead_data:
        call: http.get
        args:
          url: ${lead_service_url + "/api/v1/leads/" + lead_id}
          auth:
            type: OIDC
        result: lead_response

    - check_lead_fetched:
        switch:
          - condition: ${lead_response.code == 200}
            next: set_lead_data
        next: lead_fetch_failed

    - set_lead_data:
        assign:
          - lead: ${lead_response.body}
          - client_first_name: ${lead_response.body.firstName}
          - client_last_name: ${lead_response.body.lastName}
          - client_phone: ${lead_response.body.phone}

    # Advance the case status in Case Development so the paralegal dashboard
    # reflects that onboarding is actively in progress.
    - update_case_status_onboarding:
        call: http.put
        args:
          url: ${case_dev_url + "/api/v1/cases/" + case_id + "/status"}
          auth:
            type: OIDC
          body:
            status: "client_onboarding"
            updated_by: "workflow-orchestrator"
        result: status_onboarding_response

    - create_portal_account:
        call: http.post
        args:
          url: ${portal_url + "/api/v1/portal/auth"}
          auth:
            type: OIDC
          body:
            case_id: ${case_id}
            email: ${client_email}
            first_name: ${client_first_name}
            last_name: ${client_last_name}
            action: "create_account"
        result: portal_response

    - check_portal_created:
        switch:
          - condition: ${portal_response.code == 200 or portal_response.code == 201}
            next: send_retainer
        next: portal_creation_failed

    - send_retainer:
        call: http.post
        args:
          url: ${ext_sync_url + "/api/v1/integrations/docusign/send-retainer"}
          auth:
            type: OIDC
          body:
            case_id: ${case_id}
            client_email: ${client_email}
            template: ${config.step_parameters.send_retainer.docusign_template_id}
        result: docusign_response

    - build_document_checklist:
        call: http.post
        args:
          url: ${portal_url + "/api/v1/portal/checklist"}
          auth:
            type: OIDC
          body:
            case_id: ${case_id}
            checklist_type: "standard_vcf"
        result: checklist_response

    - send_welcome_notification:
        call: http.post
        args:
          url: ${notification_url + "/api/v1/notifications/email"}
          auth:
            type: OIDC
          body:
            template: "client_welcome"
            case_id: ${case_id}
            client_email: ${client_email}
            portal_url: ${portal_response.body.portal_login_url}
        result: welcome_notify_response

    - send_sms_notification:
        call: http.post
        args:
          url: ${notification_url + "/api/v1/notifications/sms"}
          auth:
            type: OIDC
          body:
            template: "client_welcome_sms"
            case_id: ${case_id}
            phone: ${client_phone}
        result: sms_response

    - wait_for_retainer:
        call: sys.sleep
        args:
          seconds: 60

    - check_retainer_status:
        call: http.get
        args:
          url: ${ext_sync_url + "/api/v1/integrations/status?case_id=" + case_id + "&type=retainer"}
          auth:
            type: OIDC
        result: retainer_status

    - evaluate_retainer:
        switch:
          - condition: ${retainer_status.body.signed == true}
            next: update_case_status_pending_review
        next: send_retainer_followup

    - send_retainer_followup:
        call: http.post
        args:
          url: ${notification_url + "/api/v1/notifications/email"}
          auth:
            type: OIDC
          body:
            template: "retainer_reminder"
            case_id: ${case_id}
            client_email: ${client_email}
        result: followup_response

    # Retainer is signed — advance the case so the paralegal queue picks it up.
    - update_case_status_pending_review:
        call: http.put
        args:
          url: ${case_dev_url + "/api/v1/cases/" + case_id + "/status"}
          auth:
            type: OIDC
          body:
            status: "pending_paralegal_review"
            updated_by: "workflow-orchestrator"
        result: status_review_response

    # Fetch current paralegal workloads and pick the least-loaded staff member.
    - fetch_paralegal_workload:
        call: http.get
        args:
          url: ${case_dev_url + "/api/v1/staff/paralegals/workload"}
          auth:
            type: OIDC
        result: workload_response

    - set_assigned_paralegal:
        assign:
          - assigned_paralegal_id: ${workload_response.body.least_loaded_paralegal_id}

    - assign_paralegal:
        call: http.post
        args:
          url: ${case_dev_url + "/api/v1/cases/" + case_id + "/assign"}
          auth:
            type: OIDC
          body:
            paralegal_id: ${assigned_paralegal_id}
            reason: "Auto-assigned by client-onboarding workflow after retainer signed"
        result: assignment_response

    - notify_paralegal_assigned:
        call: http.post
        args:
          url: ${notification_url + "/api/v1/notifications/email"}
          auth:
            type: OIDC
          body:
            template: "paralegal_case_assigned"
            case_id: ${case_id}
            paralegal_id: ${assigned_paralegal_id}
        result: paralegal_notify_response

    - trigger_vcf_enrollment:
        call: http.post
        args:
          url: ${orchestrator_url + "/api/v1/workflows/trigger"}
          auth:
            type: OIDC
          body:
            case_id: ${case_id}
            workflow_type: "vcf-enrollment"
            triggered_by: "client-onboarding-workflow"
            arguments:
              case_id: ${case_id}
        result: enrollment_trigger_response

    - lead_fetch_failed:
        steps:
          - build_lead_error_msg:
              assign:
                - lead_error_msg: '${"Failed to fetch lead record for lead_id: " + lead_id}'
          - raise_lead_error:
              raise:
                code: 404
                message: ${lead_error_msg}

    - portal_creation_failed:
        steps:
          - build_portal_error_msg:
              assign:
                - portal_error_msg: '${"Failed to create portal account for case: " + case_id}'
          - raise_portal_error:
              raise:
                code: 500
                message: ${portal_error_msg}

    - return_success:
        return:
          status: "onboarding_initiated"
          case_id: ${case_id}
          lead_id: ${lead_id}
          client_email: ${client_email}
          retainer_sent: true
          checklist_created: true
          assigned_paralegal_id: ${assigned_paralegal_id}
