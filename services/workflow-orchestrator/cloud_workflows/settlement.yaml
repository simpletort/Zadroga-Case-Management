# SimpleTort – Settlement & Disbursement Workflow
# Deployed as a GCP Cloud Workflow resource named: settlement
#
# Arguments: { case_id: string, award_amount: number }
#
# Steps:
#   1. Calculate settlement (fees, liens, net to client)
#   2. Generate settlement statement
#   3. Attorney approval check
#   4. Send settlement agreement to client via DocuSign
#   5. Disburse funds and sync to QuickBooks
#   6. Notify all parties and close the case

main:
  params: [args]
  steps:

    - init:
        assign:
          - case_id: ${args.case_id}
          - award_amount: ${args.award_amount}
          - workflow_id: "settlement"
          - deploy_env: ${sys.get_env("DEPLOY_ENV")}
          - settlement_url: ${"https://settlement-financial-" + deploy_env + "-" + default(default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed"), "not-deployed")}
          - case_dev_url: ${"https://case-development-" + deploy_env + "-" + default(default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed"), "not-deployed")}
          - ext_sync_url: ${"https://external-sync-" + deploy_env + "-" + default(default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed"), "not-deployed")}
          - orchestrator_url: ${"https://workflow-orchestrator-" + deploy_env + "-" + default(default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed"), "not-deployed")}
          - notification_url: ${"https://notification-" + deploy_env + "-" + default(default(sys.get_env("CLOUD_RUN_SUFFIX"), "not-deployed"), "not-deployed")}

    # Fetch configurable step parameters from Firestore via the orchestrator.
    - fetch_step_config:
        call: http.get
        args:
          url: ${orchestrator_url + "/internal/workflow-step-config/" + workflow_id}
          auth:
            type: OIDC
        result: step_config_response

    - set_config:
        assign:
          - config: ${step_config_response.body}

    - calculate_settlement:
        call: http.post
        args:
          url: ${settlement_url + "/api/v1/settlements/" + case_id + "/calculator"}
          auth:
            type: OIDC
          body:
            award_amount: ${award_amount}
            attorney_fee_percent: ${config.step_parameters.calculate_fees.default_attorney_fee_percent}
            calculate_fees: true
            calculate_liens: true
        result: calc_response

    - generate_statement:
        call: http.get
        args:
          url: ${settlement_url + "/api/v1/settlements/" + case_id + "/statement"}
          auth:
            type: OIDC
        result: statement_response

    - notify_attorney_for_approval:
        call: http.post
        args:
          url: ${notification_url + "/api/v1/notifications/email"}
          auth:
            type: OIDC
          body:
            template: "settlement_attorney_approval_required"
            case_id: ${case_id}
            award_amount: ${award_amount}
            net_to_client: ${calc_response.body.net_to_client}
            attorney_fee: ${calc_response.body.attorney_fee}
            statement_url: ${statement_response.body.download_url}
        result: attorney_notify_response

    - update_case_pending_approval:
        call: http.put
        args:
          url: ${case_dev_url + "/api/v1/cases/" + case_id + "/status"}
          auth:
            type: OIDC
          body:
            status: "settlement_pending_approval"
            updated_by: "workflow-orchestrator"
        result: pending_status_response

    # In production this step waits for a callback from the attorney approval task
    # Here we proceed optimistically; the task completion event triggers re-evaluation
    - send_settlement_agreement:
        call: http.post
        args:
          url: ${ext_sync_url + "/api/v1/integrations/docusign/send-settlement"}
          auth:
            type: OIDC
          body:
            case_id: ${case_id}
            award_amount: ${award_amount}
            net_to_client: ${calc_response.body.net_to_client}
            template: "settlement_agreement"
        result: docusign_response

    - notify_client_settlement:
        call: http.post
        args:
          url: ${notification_url + "/api/v1/notifications/email"}
          auth:
            type: OIDC
          body:
            template: "settlement_agreement_for_signature"
            case_id: ${case_id}
            net_to_client: ${calc_response.body.net_to_client}
        result: client_settle_notify_response

    - notify_client_settlement_sms:
        call: http.post
        args:
          url: ${notification_url + "/api/v1/notifications/sms"}
          auth:
            type: OIDC
          body:
            template: "settlement_sms"
            case_id: ${case_id}
        result: sms_response

    - disburse_funds:
        call: http.put
        args:
          url: ${settlement_url + "/api/v1/settlements/" + case_id + "/disbursement"}
          auth:
            type: OIDC
          body:
            amount: ${calc_response.body.net_to_client}
            attorney_fee: ${calc_response.body.attorney_fee}
            disbursement_method: "check"
            updated_by: "workflow-orchestrator"
        result: disbursement_response

    - sync_to_quickbooks:
        call: http.post
        args:
          url: ${ext_sync_url + "/api/v1/integrations/quickbooks/sync"}
          auth:
            type: OIDC
          body:
            case_id: ${case_id}
            transaction_type: "settlement_disbursement"
            amount: ${award_amount}
            attorney_fee: ${calc_response.body.attorney_fee}
            net_to_client: ${calc_response.body.net_to_client}
        result: qb_sync_response

    - close_case:
        call: http.put
        args:
          url: ${case_dev_url + "/api/v1/cases/" + case_id + "/status"}
          auth:
            type: OIDC
          body:
            status: "closed"
            close_reason: "settlement_disbursed"
            updated_by: "workflow-orchestrator"
        result: close_response

    - notify_case_closed:
        call: http.post
        args:
          url: ${notification_url + "/api/v1/notifications/email"}
          auth:
            type: OIDC
          body:
            template: "case_closed"
            case_id: ${case_id}
            award_amount: ${award_amount}
            net_to_client: ${calc_response.body.net_to_client}
        result: closed_notify_response

    - return_success:
        return:
          status: "settlement_complete"
          case_id: ${case_id}
          award_amount: ${award_amount}
          net_to_client: ${calc_response.body.net_to_client}
          attorney_fee: ${calc_response.body.attorney_fee}
          quickbooks_synced: ${qb_sync_response.body.success}
