steps:
  - name: "python:3.11-slim"
    dir: "services/storage-gateway"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt
        pytest tests/ -v --tb=short

  - name: "gcr.io/cloud-builders/docker"
    dir: "services/storage-gateway"
    args:
      - build
      - "-t"
      - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "-t"
      - "$_REPO/$_SERVICE_NAME:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:latest"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME-$_ENV"
      - "--image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--set-env-vars=GCS_SERVICE_ACCOUNT_EMAIL=$_GCS_SA_EMAIL,GCS_BUCKET_NAME=$_GCS_BUCKET_NAME"

images:
  - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
  - "$_REPO/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
