substitutions:
  _SERVICE_NAME: storage-gateway
  _REGION: us-central1
  _REPO: us-central1-docker.pkg.dev/$PROJECT_ID/simpletort
  _ENV: dev  # overridden per trigger (dev/staging/prod)

steps:
  # 1. Install all deps (including devDependencies for lint + tests)
  - name: 'node:18-alpine'
    entrypoint: npm
    args: ['ci']
    dir: 'services/$_SERVICE_NAME'

  # 2. Lint
  - name: 'node:18-alpine'
    entrypoint: npm
    args: ['run', 'lint']
    dir: 'services/$_SERVICE_NAME'

  # 3. Unit tests
  - name: 'node:18-alpine'
    entrypoint: npm
    args: ['test']
    dir: 'services/$_SERVICE_NAME'

  # 4. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '$_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_REPO/$_SERVICE_NAME:$_ENV-latest'
      - '-f'
      - 'services/$_SERVICE_NAME/Dockerfile'
      - 'services/$_SERVICE_NAME'

  # 5. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '$_REPO/$_SERVICE_NAME']

  # 6. Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - '$_SERVICE_NAME-$_ENV'
      - '--image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCS_BUCKET_NAME=$_GCS_BUCKET,NODE_ENV=$_ENV'

options:
  logging: CLOUD_LOGGING_ONLY