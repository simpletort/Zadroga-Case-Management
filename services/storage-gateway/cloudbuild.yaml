steps:
  - name: "python:3.11-slim"
    dir: "services/storage-gateway"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt
        pytest tests/ -v --tb=short

  - name: "gcr.io/cloud-builders/docker"
    dir: "services/storage-gateway"
    args:
      - build
      - "-t"
      - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "-t"
      - "$_REPO/$_SERVICE_NAME:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:latest"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        bash scripts/deploy.sh \
          $_ENV \
          $_SERVICE_NAME \
          $_REPO \
          $COMMIT_SHA \
          $_REGION \
          $PROJECT_ID

images:
  - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
  - "$_REPO/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  timeout: 1800s   # 30 min — canary window (15 min) + build time
