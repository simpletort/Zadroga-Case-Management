steps:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  - name: "python:3.11-slim"
    dir: "services/reporting-service"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install ../../shared
        pip install -r requirements.txt
        pytest tests/ -v --tb=short

  # ── 2. Build (context = repo root so Dockerfile can COPY shared/) ───────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "-t"
      - "$_REPO/$_SERVICE_NAME:latest"
      - "-f"
      - "services/reporting-service/Dockerfile"
      - "."

  # ── 3. Push ──────────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REPO/$_SERVICE_NAME:latest"]

  # ── 4. Deploy ────────────────────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,ENV=$_ENV,FIRESTORE_DATABASE_ID=$_FIRESTORE_DATABASE_ID"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--max-instances=10"
      - "--min-instances=0"

images:
  - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
  - "$_REPO/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
