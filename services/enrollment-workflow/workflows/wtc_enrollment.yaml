# wtc_enrollment.yaml — Cloud Workflows definition for WTC Health Program
# enrollment sub-workflow.
#
# Triggered by: enrollment-workflow service via Cloud Workflows API
# when a case is identified as Not Enrolled in WTC Health Program.
#
# Steps:
#   1. Check case eligibility (not already enrolled, not deceased)
#   2. Call enrollment-workflow service to trigger workflow
#   3. Poll for application submission (status = Application Pending)
#   4. Poll for enrollment confirmation (status = Enrolled)
#   5. Trigger VCF registration workflow on enrollment
#   6. Handle errors and edge cases
#
# Edge cases:
#   - Already Enrolled: log and exit
#   - Deceased: log and exit
#   - Application timeout (30 days): escalate to attorney
#   - Enrollment timeout (90 days): escalate to attorney

main:
  params: [args]
  steps:
    - init:
        assign:
          - case_id: ${args.caseId}
          - enrollment_service_url: ${args.enrollmentServiceUrl}
          - auth_token: ${args.authToken}
          - max_application_wait_days: 30
          - max_enrollment_wait_days: 90
          - poll_interval_seconds: 86400  # 24 hours between status checks

    # ── Step 1: Get current case enrollment status ────────────────────────
    - get_case_wtc_status:
        call: http.get
        args:
          url: ${enrollment_service_url + "/api/v1/wtc/" + case_id}
          auth:
            type: OIDC
          headers:
            Authorization: ${"Bearer " + auth_token}
        result: wtc_response

    # ── Step 2: Check eligibility ─────────────────────────────────────────
    - check_eligibility:
        switch:
          - condition: ${wtc_response.body.status == "Enrolled"}
            next: already_enrolled
          - condition: ${wtc_response.body.status == "Deceased"}
            next: case_deceased
          - condition: ${wtc_response.body.status == "Already Enrolled"}
            next: already_enrolled
          - condition: ${true}
            next: trigger_workflow

    # ── Step 3: Trigger WTC enrollment workflow ───────────────────────────
    - trigger_workflow:
        call: http.post
        args:
          url: ${enrollment_service_url + "/api/v1/wtc/trigger"}
          auth:
            type: OIDC
          headers:
            Authorization: ${"Bearer " + auth_token}
            Content-Type: application/json
          body:
            caseId: ${case_id}
            force: false
        result: trigger_response

    - check_trigger_result:
        switch:
          - condition: ${trigger_response.body.triggered == false}
            next: workflow_skipped
          - condition: ${true}
            next: wait_for_application

    # ── Step 4: Wait for Application Pending ─────────────────────────────
    - wait_for_application:
        assign:
          - application_wait_days: 0

    - poll_application_status:
        call: http.get
        args:
          url: ${enrollment_service_url + "/api/v1/wtc/" + case_id}
          auth:
            type: OIDC
        result: app_status_response

    - check_application_status:
        switch:
          - condition: ${app_status_response.body.status == "Application Pending"}
            next: wait_for_enrollment
          - condition: ${app_status_response.body.status == "Enrolled"}
            next: enrollment_confirmed
          - condition: ${application_wait_days >= max_application_wait_days}
            next: application_timeout
          - condition: ${true}
            next: sleep_before_app_poll

    - sleep_before_app_poll:
        call: sys.sleep
        args:
          seconds: ${poll_interval_seconds}
        next: increment_application_wait

    - increment_application_wait:
        assign:
          - application_wait_days: ${application_wait_days + 1}
        next: poll_application_status

    # ── Step 5: Wait for Enrollment Confirmation ──────────────────────────
    - wait_for_enrollment:
        assign:
          - enrollment_wait_days: 0

    - poll_enrollment_status:
        call: http.get
        args:
          url: ${enrollment_service_url + "/api/v1/wtc/" + case_id}
          auth:
            type: OIDC
        result: enroll_status_response

    - check_enrollment_status:
        switch:
          - condition: ${enroll_status_response.body.status == "Enrolled"}
            next: enrollment_confirmed
          - condition: ${enrollment_wait_days >= max_enrollment_wait_days}
            next: enrollment_timeout
          - condition: ${true}
            next: sleep_before_enroll_poll

    - sleep_before_enroll_poll:
        call: sys.sleep
        args:
          seconds: ${poll_interval_seconds}
        next: increment_enrollment_wait

    - increment_enrollment_wait:
        assign:
          - enrollment_wait_days: ${enrollment_wait_days + 1}
        next: poll_enrollment_status

    # ── Step 6: Enrollment confirmed — trigger VCF registration ───────────
    - enrollment_confirmed:
        call: http.post
        args:
          url: ${enrollment_service_url + "/api/v1/vcf/register"}
          auth:
            type: OIDC
          headers:
            Content-Type: application/json
          body:
            caseId: ${case_id}
        result: vcf_init_response

    - workflow_complete:
        return:
          caseId: ${case_id}
          result: "enrollment_complete"
          wtcStatus: "Enrolled"
          vcfRegistrationInitiated: ${vcf_init_response.body.initiated}
          message: "WTC enrollment complete. VCF registration workflow initiated."

    # ── Edge cases ────────────────────────────────────────────────────────
    - already_enrolled:
        return:
          caseId: ${case_id}
          result: "skipped_already_enrolled"
          message: "Case already enrolled in WTC Health Program."

    - case_deceased:
        return:
          caseId: ${case_id}
          result: "skipped_deceased"
          message: "Workflow skipped — case marked as deceased."

    - workflow_skipped:
        return:
          caseId: ${case_id}
          result: "skipped"
          message: ${trigger_response.body.message}

    - application_timeout:
        steps:
          - log_application_timeout:
              call: sys.log
              args:
                text: ${"WTC application timeout for case " + case_id + " after " + string(max_application_wait_days) + " days"}
                severity: WARNING
          - return_application_timeout:
              return:
                caseId: ${case_id}
                result: "application_timeout"
                message: ${"No application submission after " + string(max_application_wait_days) + " days. Manual review required."}

    - enrollment_timeout:
        steps:
          - log_enrollment_timeout:
              call: sys.log
              args:
                text: ${"WTC enrollment timeout for case " + case_id + " after " + string(max_enrollment_wait_days) + " days"}
                severity: WARNING
          - return_enrollment_timeout:
              return:
                caseId: ${case_id}
                result: "enrollment_timeout"
                message: ${"Enrollment not confirmed after " + string(max_enrollment_wait_days) + " days. Attorney review required."}
