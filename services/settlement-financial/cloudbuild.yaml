steps:
  # 1. Test
  - name: "python:3.11-slim"
    id: test
    dir: "services/settlement-financial"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install ../../shared --quiet
        pip install -r requirements.txt --quiet
        pytest tests/ -v --tb=short -m "unit"

  # 2. Build (context = repo root so Dockerfile can COPY shared/)
  - name: "gcr.io/cloud-builders/docker"
    id: build
    waitFor: ["test"]
    args:
      - build
      - "-t"
      - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "-t"
      - "$_REPO/$_SERVICE_NAME:$_ENV-latest"
      - "-f"
      - "services/settlement-financial/Dockerfile"
      - "."

  # 3. Push image
  - name: "gcr.io/cloud-builders/docker"
    id: push
    waitFor: ["build"]
    args: ["push", "--all-tags", "$_REPO/$_SERVICE_NAME"]

  # 4. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    waitFor: ["push"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "$_SERVICE_NAME"
      - "--image=$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--set-env-vars=^|^GCP_PROJECT_ID=$PROJECT_ID|ENVIRONMENT=$_ENV|FIRESTORE_DATABASE_ID=$_FIRESTORE_DATABASE_ID|ROLES_FIRESTORE_DATABASE_ID=$_ROLES_FIRESTORE_DATABASE_ID|TRUSTED_SERVICE_ACCOUNTS=$_TRUSTED_SERVICE_ACCOUNTS|STORAGE_GATEWAY_URL=$_STORAGE_GATEWAY_URL|GCS_BUCKET=$_GCS_BUCKET"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--max-instances=10"
      - "--min-instances=0"

images:
  - "$_REPO/$_SERVICE_NAME:$COMMIT_SHA"
  - "$_REPO/$_SERVICE_NAME:$_ENV-latest"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1800s"
