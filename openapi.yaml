          description: Submitted for review
        401:
          description: Unauthorized

  # --- Search ---

  /api/v1/cases/search:
    options:
      operationId: corsPreflightCaseSearch
      security: []
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        204:
          description: CORS preflight
    get:
      summary: "Advanced full-text search and filtering (min role: paralegal)"
      operationId: searchCases
      parameters:
        - { name: q, in: query, type: string }
        - { name: statuses, in: query, type: string }
        - { name: case_type, in: query, type: string }
        - { name: assignees, in: query, type: string }
        - { name: attorney, in: query, type: string }
        - { name: deadline_from, in: query, type: string }
        - { name: deadline_to, in: query, type: string }
        - { name: created_from, in: query, type: string }
        - { name: created_to, in: query, type: string }
        - { name: completeness_min, in: query, type: number }
        - { name: completeness_max, in: query, type: number }
        - { name: qual_min, in: query, type: number }
        - { name: qual_max, in: query, type: number }
        - { name: screening_result, in: query, type: string }
        - { name: sort_by, in: query, type: string }
        - { name: sort_dir, in: query, type: string }
        - { name: page, in: query, type: integer }
        - { name: page_size, in: query, type: integer }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
