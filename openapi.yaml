        204:
          description: CORS preflight
    post:
      summary: "Reject a case from Pending Attorney Review (min role: junior_partner)"
      operationId: rejectCase
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
