swagger: "2.0"
info:
  title: SimpleTort API Gateway
  version: "1.0.0"
host: "simpletort-api.apigateway.simpletort-zadroga-dev.cloud.goog"
schemes:
  - https
produces:
  - application/json

# All endpoints require a Firebase JWT unless explicitly overridden with security: []
security:
  - firebase: []

paths:

  # ============================================================
  # HEALTH CHECK (no auth — Cloud Run liveness probe passthrough)
  # ============================================================
  /health:
    get:
      summary: Liveness probe
      operationId: healthCheck
      security: []
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app/health
        path_translation: CONSTANT_ADDRESS
      responses:
        200:
          description: Service is healthy

  # ============================================================
  # CASE DEVELOPMENT SERVICE
  # Cloud Run: https://case-development-292736139819.us-central1.run.app
  # Min role required per endpoint is enforced by the service itself (RBAC).
  # ============================================================

  # --- Dashboard ---

  /api/v1/dashboard/cases:
    get:
      summary: Paginated filterable case list with KPI summary
      operationId: getDashboardCases
      parameters:
        - { name: statuses, in: query, type: string }
        - { name: case_type, in: query, type: string }
        - { name: assignees, in: query, type: string }
        - { name: deadline_from, in: query, type: string }
        - { name: deadline_to, in: query, type: string }
        - { name: completeness_min, in: query, type: number }
        - { name: completeness_max, in: query, type: number }
        - { name: qual_min, in: query, type: number }
        - { name: qual_max, in: query, type: number }
        - { name: sort_by, in: query, type: string }
        - { name: sort_dir, in: query, type: string }
        - { name: page, in: query, type: integer }
        - { name: page_size, in: query, type: integer }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Success
        401:
          description: Unauthorized

  # --- Assignment ---

  /api/v1/cases/{caseId}/assign:
    post:
      summary: "Manually assign or re-assign a case (min role: admin_staff)"
      operationId: assignCase
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Assignment updated
        401:
          description: Unauthorized
        403:
          description: Insufficient role

  /api/v1/cases/{caseId}/assignment:
    get:
      summary: "Get current assignment for a case (min role: paralegal)"
      operationId: getCaseAssignment
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Success
        401:
          description: Unauthorized

  /api/v1/staff/paralegals/workload:
    get:
      summary: "Workload distribution across all paralegals (min role: paralegal)"
      operationId: getParalegalWorkload
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Success
        401:
          description: Unauthorized

  # --- Attorney Review ---

  /api/v1/attorney/review-queue:
    get:
      summary: "Paginated attorney review queue (min role: junior_partner)"
      operationId: getReviewQueue
      parameters:
        - { name: page, in: query, type: integer }
        - { name: page_size, in: query, type: integer }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Success
        401:
          description: Unauthorized
        403:
          description: Insufficient role

  /api/v1/cases/{caseId}/approve-for-filing:
    post:
      summary: "Approve a single case for filing (min role: junior_partner)"
      operationId: approveCase
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Case approved
        401:
          description: Unauthorized
        403:
          description: Insufficient role

  /api/v1/cases/bulk-approve:
    post:
      summary: "Bulk approve multiple cases for filing (min role: junior_partner)"
      operationId: bulkApproveCases
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Bulk operation successful
        401:
          description: Unauthorized
        403:
          description: Insufficient role

  # --- Escalation ---

  /api/v1/cases/{caseId}/escalate:
    post:
      summary: "Escalate a case to senior partner review (min role: junior_partner)"
      description: >
        Junior partner escalates a case from "Pending Attorney Review" to
        "Pending Senior Review". Captures the escalation reason
        (high_value_claim | unusual_medical_condition | prior_attorney_conflict | other)
        and optional notes. Notes are required when reason is "other".
        Notifies all active senior partners via in-app notification.
      operationId: escalateCase
      parameters:
        - { name: caseId, in: path, required: true, type: string }
        - name: body
          in: body
          required: true
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                enum:
                  - high_value_claim
                  - unusual_medical_condition
                  - prior_attorney_conflict
                  - other
              notes:
                type: string
                description: "Required when reason is 'other'; optional otherwise."
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Case escalated — returns escalation_id and notified_count
          schema:
            type: object
            properties:
              case_id:        { type: string }
              status:         { type: string, example: "Pending Senior Review" }
              escalated_at:   { type: string, format: date-time }
              escalation_id:  { type: string, format: uuid }
              notified_count: { type: integer }
        401:
          description: Unauthorized
        403:
          description: "Insufficient role (min: junior_partner) or not the assigned attorney"
        404:
          description: Case not found
        422:
          description: "Case not in 'Pending Attorney Review', or notes missing for reason=other"

  /api/v1/attorney/escalation-queue:
    get:
      summary: "Paginated escalation queue for senior partners (min role: senior_partner)"
      description: >
        Returns cases in "Pending Senior Review" status, sorted by
        VCF deadline proximity → escalation date (oldest first) → qualification score.
        Only accessible to senior_partner and system_admin roles.
      operationId: getEscalationQueue
      parameters:
        - { name: page, in: query, type: integer, default: 1 }
        - { name: page_size, in: query, type: integer, default: 20 }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Paginated escalation queue with escalation metadata per case
          schema:
            type: object
            properties:
              total_pending: { type: integer }
              overdue_count: { type: integer }
              page:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        case_id:              { type: string }
                        first_name:           { type: string }
                        last_name:            { type: string }
                        case_type:            { type: string }
                        vcf_deadline:         { type: string, format: date-time }
                        qual_score:           { type: number }
                        days_until_deadline:  { type: integer }
                        escalation_id:        { type: string, format: uuid }
                        escalation_reason:    { type: string }
                        escalated_at:         { type: string, format: date-time }
                        escalated_by_name:    { type: string }
                        original_attorney_id: { type: string }
                        escalation_notes:     { type: string }
                  total:       { type: integer }
                  page:        { type: integer }
                  page_size:   { type: integer }
                  total_pages: { type: integer }
        401:
          description: Unauthorized
        403:
          description: "Insufficient role (min: senior_partner)"

  /api/v1/cases/{caseId}/escalation-decision:
    post:
      summary: "Senior partner decision on an escalated case (min role: senior_partner)"
      description: >
        Resolves a case that is in "Pending Senior Review".
        Three decisions are supported:
        - approve: advances to "Approved for Filing" — creates 3 filing-prep tasks,
          notifies paralegal and original junior partner.
        - reject: returns to "Pending Attorney Review" — notifies original junior partner.
        - return_to_paralegal: returns to "Pending Paralegal Review" —
          notifies original junior partner and assigned paralegal.
        Notes are required for reject and return_to_paralegal.
        All decisions update the escalation history sub-document and
        the top-level escalation_events metrics collection.
      operationId: escalationDecision
      parameters:
        - { name: caseId, in: path, required: true, type: string }
        - name: body
          in: body
          required: true
          schema:
            type: object
            required: [decision]
            properties:
              decision:
                type: string
                enum:
                  - approve
                  - reject
                  - return_to_paralegal
              notes:
                type: string
                description: "Required when decision is 'reject' or 'return_to_paralegal'."
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Decision recorded and case status updated
          schema:
            type: object
            properties:
              case_id:     { type: string }
              decision:    { type: string, enum: [approve, reject, return_to_paralegal] }
              resolved_at: { type: string, format: date-time }
              resolved_by: { type: string }
              notes:       { type: string }
              task_ids:    { type: array, items: { type: string } }
              new_status:  { type: string }
        401:
          description: Unauthorized
        403:
          description: "Insufficient role (min: senior_partner)"
        404:
          description: Case not found
        422:
          description: "Case not in 'Pending Senior Review', or notes missing for reject/return"

  # --- Communications ---

  /api/v1/cases/{caseId}/communications:
    get:
      summary: "Paginated communication log for a case (min role: paralegal)"
      operationId: getCaseCommunications
      parameters:
        - { name: caseId, in: path, required: true, type: string }
        - { name: channel, in: query, type: string }
        - { name: page, in: query, type: integer }
        - { name: page_size, in: query, type: integer }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Success
        401:
          description: Unauthorized
    post:
      summary: "Log a new manual communication entry (min role: paralegal)"
      operationId: logCaseCommunication
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        201:
          description: Communication logged
        401:
          description: Unauthorized

  # --- Review / Submit ---

  /api/v1/cases/{caseId}/review-preflight:
    get:
      summary: "Check submission readiness for a case (min role: paralegal)"
      operationId: getCaseReviewPreflight
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Preflight result
        401:
          description: Unauthorized

  /api/v1/cases/{caseId}/submit-for-review:
    post:
      summary: "Submit case for attorney review (min role: paralegal)"
      operationId: submitCaseForReview
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Submitted for review
        401:
          description: Unauthorized

  # --- Search ---

  /api/v1/cases/search:
    get:
      summary: "Advanced full-text search and filtering (min role: paralegal)"
      operationId: searchCases
      parameters:
        - { name: q, in: query, type: string }
        - { name: statuses, in: query, type: string }
        - { name: case_type, in: query, type: string }
        - { name: assignees, in: query, type: string }
        - { name: attorney, in: query, type: string }
        - { name: deadline_from, in: query, type: string }
        - { name: deadline_to, in: query, type: string }
        - { name: created_from, in: query, type: string }
        - { name: created_to, in: query, type: string }
        - { name: completeness_min, in: query, type: number }
        - { name: completeness_max, in: query, type: number }
        - { name: qual_min, in: query, type: number }
        - { name: qual_max, in: query, type: number }
        - { name: screening_result, in: query, type: string }
        - { name: sort_by, in: query, type: string }
        - { name: sort_dir, in: query, type: string }
        - { name: page, in: query, type: integer }
        - { name: page_size, in: query, type: integer }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Search results
        401:
          description: Unauthorized

  /api/v1/cases/search/export:
    get:
      summary: "Export filtered search results as CSV (min role: paralegal)"
      operationId: exportCaseSearch
      parameters:
        - { name: q, in: query, type: string }
        - { name: statuses, in: query, type: string }
        - { name: case_type, in: query, type: string }
        - { name: assignees, in: query, type: string }
        - { name: attorney, in: query, type: string }
        - { name: deadline_from, in: query, type: string }
        - { name: deadline_to, in: query, type: string }
        - { name: created_from, in: query, type: string }
        - { name: created_to, in: query, type: string }
        - { name: completeness_min, in: query, type: number }
        - { name: completeness_max, in: query, type: number }
        - { name: qual_min, in: query, type: number }
        - { name: qual_max, in: query, type: number }
        - { name: screening_result, in: query, type: string }
        - { name: sort_by, in: query, type: string }
        - { name: sort_dir, in: query, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: CSV file download
        401:
          description: Unauthorized

  /api/v1/search/presets:
    get:
      summary: "List saved filter presets for current user (min role: paralegal)"
      operationId: listSearchPresets
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: List of presets
        401:
          description: Unauthorized
    post:
      summary: "Save a new filter preset (min role: paralegal)"
      operationId: createSearchPreset
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        201:
          description: Preset created
        401:
          description: Unauthorized

  /api/v1/search/presets/{preset_id}:
    patch:
      summary: "Update a saved filter preset (min role: paralegal)"
      operationId: updateSearchPreset
      parameters:
        - { name: preset_id, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Preset updated
        401:
          description: Unauthorized
    delete:
      summary: "Delete a saved filter preset (min role: paralegal)"
      operationId: deleteSearchPreset
      parameters:
        - { name: preset_id, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        204:
          description: Preset deleted
        401:
          description: Unauthorized

securityDefinitions:
  firebase:
    authorizationUrl: ""
    flow: implicit
    type: oauth2
    x-google-issuer: "https://securetoken.google.com/simpletort-zadroga-dev"
    x-google-jwks_uri: "https://www.googleapis.com/service_accounts/v1/metadata/x509/securetoken@system.gserviceaccount.com"
    x-google-audiences: "simpletort-zadroga-dev"
