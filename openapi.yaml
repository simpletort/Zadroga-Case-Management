    get:
      summary: "Paginated communication log for a case (min role: paralegal)"
      operationId: getCaseCommunications
      parameters:
        - { name: caseId, in: path, required: true, type: string }
        - { name: channel, in: query, type: string }
        - { name: page, in: query, type: integer }
        - { name: page_size, in: query, type: integer }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        200:
          description: Success
        401:
          description: Unauthorized
    post:
      summary: "Log a new manual communication entry (min role: paralegal)"
      operationId: logCaseCommunication
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        201:
          description: Communication logged
        401:
          description: Unauthorized

  # --- Review / Submit ---

  /api/v1/cases/{caseId}/review-preflight:
    options:
      operationId: corsPreflightCaseReviewPreflight
      security: []
      parameters:
        - { name: caseId, in: path, required: true, type: string }
      x-google-backend:
        address: https://case-development-292736139819.us-central1.run.app
